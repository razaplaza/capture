<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<title>Smæsh</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#11161c" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#e8eef2; --mute:#7d8a96; --line:#243039; --card:#1a222b; --edge:#2a3642;
    --teal:#3fd2c7; --teal-d:#2fb8ad; --gain:#4ee39a; --rec:#ff5a4f; --warn:#ffb547; --danger:#ff6b6b;
    --ui:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
    --st:env(safe-area-inset-top, 0px); --sb:env(safe-area-inset-bottom, 0px);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden] { display:none !important; }
  html, body { height:100%; }
  body { font-family:var(--ui); color:var(--ink); font-size:15px; overflow:hidden; -webkit-font-smoothing:antialiased;
         background:radial-gradient(120% 60% at 50% 0%, #1b2530 0%, #11161c 55%, #0d1116 100%) fixed, #0d1116;
         user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  button { font:inherit; color:inherit; border:0; background:none; cursor:pointer; }
  input { font:inherit; }
  svg { width:22px; height:22px; flex-shrink:0; }
  .app { position:fixed; inset:0; display:flex; flex-direction:column; }
  .top { padding:calc(var(--st) + 14px) 20px 6px; display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .top .word { font-weight:700; font-size:28px; letter-spacing:-.02em; }
  .top .tact { margin-left:auto; display:flex; gap:8px; }
  .iconbtn { width:42px; height:42px; border-radius:12px; background:var(--card); border:1px solid var(--edge); display:grid; place-items:center; position:relative; }
  .iconbtn input { position:absolute; inset:0; opacity:0; }
  .body { flex:1; min-height:0; overflow-y:auto; padding:10px 18px 20px; display:flex; flex-direction:column; gap:14px; -webkit-overflow-scrolling:touch; }
  .lab { font-size:11.5px; font-weight:700; letter-spacing:.08em; color:var(--mute); }
  .tabs { flex-shrink:0; background:#131a21; border-top:1px solid var(--line); display:grid; grid-template-columns:repeat(5,1fr);
          align-items:center; padding:8px 0 calc(var(--sb) + 8px); }
  .tab { display:flex; flex-direction:column; align-items:center; gap:4px; font-size:11px; color:var(--mute); position:relative; }
  .tab.on { color:var(--teal); }
  .tab .dot { position:absolute; top:-3px; right:calc(50% - 18px); min-width:17px; height:17px; border-radius:9px; background:var(--warn); color:#1a1200;
              font-size:10px; font-weight:800; display:grid; place-items:center; padding:0 4px; }
  .tab.mid { margin-top:-30px; touch-action:none; }
  .tab.mid i { width:66px; height:66px; border-radius:50%; background:radial-gradient(circle at 40% 30%, #56e3d8, #2aa99f); display:grid; place-items:center;
               box-shadow:0 0 0 6px #131a21, 0 8px 24px rgba(63,210,199,.35); transition:transform .15s; }
  .tab.mid i::after { content:''; width:24px; height:24px; border-radius:50%; background:var(--rec); box-shadow:0 0 0 3px #062825; }
  .tab.mid.on i { box-shadow:0 0 0 6px #131a21, 0 0 0 8px var(--teal), 0 8px 24px rgba(63,210,199,.35); }
  .tab.mid:active i { transform:scale(.94); }

  /* record: big tiles that expand */
  .banner { display:flex; align-items:center; gap:12px; background:linear-gradient(90deg,#1f2a35,#1a232d); border:1px solid var(--teal); border-radius:14px; padding:12px 14px; }
  .banner b { flex:1; font-size:14.5px; } .banner button { color:var(--mute); font-weight:600; font-size:13px; }
  .cats { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px; }
  .cat { display:flex; align-items:center; gap:12px; padding:18px 15px; border-radius:18px; background:var(--card); border:1px solid var(--edge);
         font-weight:600; font-size:16px; min-width:0; text-align:left; }
  .cat svg { width:34px; height:34px; color:var(--teal); stroke-width:1.6; }
  .cat .n { margin-left:auto; font-family:var(--mono); font-size:12px; color:var(--mute); font-weight:500; }
  .cat.on { border-color:var(--teal); background:rgba(63,210,199,.1); }
  .drawer { grid-column:1/-1; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; padding:12px; border-radius:14px;
            background:#141b22; border:1px solid var(--edge); animation:open .18s ease-out; min-width:0; }
  @keyframes open { from { opacity:0; transform:translateY(-4px); } }
  .opt { border:1px solid var(--edge); background:var(--card); border-radius:11px; padding:13px 6px; font-weight:600; font-size:14.5px; text-align:center; line-height:1.2; }
  .opt:active { border-color:var(--teal); color:var(--teal); }
  .opt.hold { border-color:var(--teal); transform:scale(.96); transition:transform .3s; }
  .opt.add { border:1px dashed var(--teal); background:rgba(63,210,199,.06); color:var(--teal); font-size:22px; font-weight:500; line-height:1; }
  .new { border:1px solid var(--teal); background:#0d1116; color:var(--ink); border-radius:11px; padding:10px 8px; font-size:15px; font-weight:600;
         min-width:0; outline:none; text-align:center; user-select:text; -webkit-user-select:text; }
  .quick { display:flex; flex-wrap:wrap; gap:8px; }
  .quick .opt { padding:10px 14px; }

  /* library */
  .seg { display:grid; grid-auto-flow:column; grid-auto-columns:1fr; background:#1a222b; border:1px solid var(--edge); border-radius:12px; padding:3px; flex-shrink:0; }
  .seg button { padding:9px 0; font-size:12px; font-weight:700; letter-spacing:.05em; color:var(--mute); border-radius:9px; }
  .seg button.on { background:linear-gradient(90deg,var(--teal-d),var(--teal)); color:#062825; }
  .chips { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:5px; flex-shrink:0; }
  .chip { border:1px solid var(--edge); background:var(--card); border-radius:999px; padding:8px 0; font-size:12.5px; font-weight:600; color:var(--mute); }
  .chip.on { background:var(--teal); color:#062825; border-color:var(--teal); }
  .up { display:flex; align-items:center; gap:12px; background:linear-gradient(90deg,#1f2a35,#1a232d); border:1px solid var(--edge); border-radius:14px; padding:11px 12px; flex-shrink:0; }
  .up .bi { width:36px; height:36px; border-radius:10px; background:#11161c; display:grid; place-items:center; color:var(--teal); }
  .up b { font-size:14.5px; } .up .go { margin-left:auto; background:var(--teal); color:#062825; font-weight:700; border-radius:10px; padding:10px 14px; font-size:13.5px; }
  .ghead { display:flex; align-items:baseline; gap:8px; } .ghead b { font-size:15px; } .ghead span { font-family:var(--mono); font-size:11.5px; color:var(--mute); }
  .g3 { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; }
  .thumb { position:relative; border-radius:12px; overflow:hidden; aspect-ratio:3/4; background:#1c2530 center/cover no-repeat; text-align:left; }
  .thumb.wide { aspect-ratio:16/10; width:128px; flex-shrink:0; }
  .thumb .d { position:absolute; left:6px; bottom:6px; font-family:var(--mono); font-size:10.5px; padding:1px 6px; border-radius:5px; background:rgba(0,0,0,.6); }
  .thumb .k { position:absolute; left:6px; top:6px; right:32px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:10.5px; font-weight:700;
              padding:2px 7px; border-radius:6px; background:rgba(13,17,22,.8); }
  .sync { position:absolute; right:6px; top:6px; width:21px; height:21px; border-radius:50%; display:grid; place-items:center; background:rgba(13,17,22,.8); }
  .sync svg { width:12px; height:12px; } .sync.local { color:var(--mute); } .sync.sent { color:var(--gain); }
  .thumb.sel { outline:3px solid var(--teal); outline-offset:-3px; }
  .thumb .tick { position:absolute; right:6px; top:6px; width:22px; height:22px; border-radius:50%; background:var(--teal); color:#062825; display:grid; place-items:center; font-weight:800; font-size:12px; }
  .thumb .tick.off { background:rgba(13,17,22,.8); border:2px solid var(--mute); }
  .mcard { display:flex; align-items:center; gap:14px; padding:10px; border-radius:16px; background:var(--card); border:1px solid var(--edge); }
  .mcard .mt b { display:block; font-size:16px; } .mcard .mt span { display:block; margin-top:3px; font-size:12.5px; color:var(--mute); }
  .actionbar { flex-shrink:0; display:flex; gap:8px; padding:12px 16px calc(var(--sb) + 12px); background:#131a21; border-top:1px solid var(--line); }
  .actionbar button { flex:1; border:1px solid var(--edge); background:var(--card); border-radius:12px; padding:13px 8px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:7px; }
  .actionbar .primary { background:var(--teal); color:#062825; border-color:var(--teal); }
  .actionbar .danger { color:var(--danger); } .actionbar .danger.sure { background:var(--danger); color:#1a0505; border-color:var(--danger); }
  .actionbar svg { width:18px; height:18px; }
  .empty { margin:auto; text-align:center; color:var(--mute); display:flex; flex-direction:column; align-items:center; gap:12px; }
  .empty svg { width:42px; height:42px; color:var(--edge); }
  .empty button { background:var(--teal); color:#062825; font-weight:700; border-radius:12px; padding:12px 18px; }

  /* settings */
  .card { background:var(--card); border:1px solid var(--edge); border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .card h3 { font-size:16px; } .card p { color:var(--mute); line-height:1.5; font-size:14px; }
  .card ol { padding-left:20px; color:var(--mute); line-height:1.6; font-size:14px; display:flex; flex-direction:column; gap:4px; }
  .card ol b { color:var(--ink); font-weight:600; }
  .stat { display:flex; justify-content:space-between; font-size:14px; } .stat span { color:var(--mute); } .stat b { font-family:var(--mono); font-weight:500; }
  .wide-btn { border:1px solid var(--edge); background:#141b22; border-radius:12px; padding:13px; font-weight:700; }
  .wide-btn.danger { color:var(--danger); } .wide-btn.sure { background:var(--danger); color:#1a0505; border-color:var(--danger); }

  /* camera */
  .cam { position:fixed; inset:0; z-index:20; background:#000; display:flex; flex-direction:column; touch-action:none; }
  .cam video.live, .cam video.loop { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .ctop { position:relative; z-index:2; padding:calc(var(--st) + 12px) 14px 30px; display:flex; align-items:center; gap:8px;
          background:linear-gradient(rgba(0,0,0,.5), transparent); }
  .pill { border-radius:10px; background:rgba(17,22,28,.8); border:1px solid var(--edge); font-size:14px; font-weight:600; padding:7px 12px; }
  .pill.label { background:linear-gradient(90deg,var(--teal-d),var(--teal)); color:#062825; border-color:transparent; }
  .timer { margin-left:auto; font-family:var(--mono); font-size:16px; color:var(--ink); background:rgba(17,22,28,.85); border:1px solid var(--edge); padding:6px 11px; border-radius:10px; }
  .timer.rec { color:var(--gain); } .timer.rec::before { content:''; display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--rec); margin-right:7px; vertical-align:middle; }
  .cbtn { width:42px; height:42px; border-radius:12px; background:rgba(17,22,28,.8); border:1px solid var(--edge); display:grid; place-items:center; color:var(--ink); }
  .opts { position:relative; z-index:2; margin-top:auto; display:flex; justify-content:center; gap:7px; flex-wrap:wrap; padding:0 12px 16px; }
  .ochip { border-radius:10px; background:rgba(17,22,28,.8); border:1px solid var(--edge); color:var(--teal); font-family:var(--mono); font-size:12.5px; padding:7px 11px; }
  .ochip span { color:var(--mute); margin-right:5px; }
  .cbot { position:relative; z-index:2; display:flex; align-items:center; justify-content:center; gap:46px; padding:4px 0 calc(var(--sb) + 26px);
          background:linear-gradient(transparent, rgba(0,0,0,.55) 40%); }
  .shut { width:84px; height:84px; border-radius:50%; border:4px solid var(--teal); display:grid; place-items:center; box-shadow:0 0 24px rgba(63,210,199,.35); }
  .shut i { width:62px; height:62px; border-radius:50%; background:var(--rec); transition:all .15s; }
  .shut.on i { width:30px; height:30px; border-radius:8px; }
  .side { width:48px; height:48px; border-radius:14px; background:rgba(17,22,28,.8) center/cover no-repeat; border:1px solid var(--edge); color:var(--teal);
          font-size:13px; font-weight:700; display:grid; place-items:center; }
  /* quick camera */
  .ring { position:relative; width:96px; height:96px; touch-action:none; }
  .ring svg { position:absolute; inset:0; width:96px; height:96px; transform:rotate(-90deg); }
  .ring .bg { fill:none; stroke:rgba(255,255,255,.9); stroke-width:6; }
  .ring .fg { fill:none; stroke:var(--rec); stroke-width:6; stroke-linecap:round; stroke-dasharray:283; stroke-dashoffset:283; }
  .ring i { position:absolute; inset:14px; border-radius:50%; background:rgba(255,255,255,.18); transition:transform .15s, background .15s; }
  .ring.on i { background:var(--rec); transform:scale(.72); }
  .qtip { position:relative; z-index:2; align-self:center; margin:auto 0 14px; font-size:13px; font-weight:600; background:rgba(0,0,0,.45); padding:6px 12px; border-radius:999px; }
  .pbar { position:relative; z-index:2; margin-top:auto; display:flex; gap:10px; padding:0 16px calc(var(--sb) + 22px); }
  .pbar button { border-radius:999px; height:56px; font-weight:700; font-size:16px; display:flex; align-items:center; justify-content:center; gap:8px; }
  .pbar .save { background:rgba(0,0,0,.55); color:#fff; padding:0 22px; border:1px solid rgba(255,255,255,.2); }
  .pbar .save.done { color:var(--gain); }
  .pbar .send { flex:1; background:var(--teal); color:#062825; }
  .pbar svg { width:20px; height:20px; }
  .xbtn { width:42px; height:42px; border-radius:50%; background:rgba(0,0,0,.45); color:#fff; font-size:24px; line-height:1; display:grid; place-items:center; }

  /* player + sheets */
  .player { position:fixed; inset:0; z-index:30; background:#000; display:flex; flex-direction:column; }
  .player video { flex:1; min-height:0; width:100%; object-fit:contain; background:#000; }
  .player .ctop { background:none; }
  .player .pbar { margin-top:0; padding-top:12px; }
  .whobar { display:flex; align-items:center; gap:12px; width:100%; padding:10px 14px; border:1px solid var(--edge); background:var(--card); border-radius:14px; text-align:left; flex-shrink:0; }
  .whobar.on { border-color:var(--teal); }
  .whobar .av { width:36px; height:36px; border-radius:50%; display:grid; place-items:center; font-weight:800; font-size:13px; color:#0d1116; flex-shrink:0; }
  .whobar .wt { flex:1; min-width:0; } .whobar small { display:block; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--mute); }
  .whobar b { font-size:17px; } .whobar .chev { color:var(--mute); }
  .body.fbody { overflow:hidden; gap:12px; padding-bottom:14px; }
  .fstage { flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; }
  .fstage .in { margin:auto 0; display:flex; flex-direction:column; gap:14px; padding:12px 2px; }
  .fstage .fcard.sel { flex-direction:row; align-items:center; gap:12px; padding:22px 14px 22px 18px; border-color:rgba(63,210,199,.45);
                        background:linear-gradient(180deg, rgba(63,210,199,.07), rgba(63,210,199,.02)), var(--card); }
  .fstage .fcard.sel .ft { flex:1; min-width:0; }
  .fstage .fcard .fx { width:32px; height:32px; border-radius:50%; display:grid; place-items:center; background:rgba(255,255,255,.06); color:var(--mute); font-size:19px; flex-shrink:0; }
  .fempty { display:grid; place-items:center; color:var(--edge); padding:40px 0; } .fempty svg { width:84px; height:84px; }
  .fdock { flex-shrink:0; display:flex; flex-direction:column; gap:10px; }
  .fmeta { text-align:center; color:var(--mute); font-size:13px; }
  .fin { position:relative; }
  .fsug { position:absolute; left:0; right:0; bottom:calc(100% + 8px); z-index:8; display:none; flex-direction:column; gap:2px; max-height:46vh; overflow-y:auto;
          background:#141b22; border:1px solid var(--edge); border-radius:14px; padding:6px; box-shadow:0 -10px 34px rgba(0,0,0,.5); }
  .fsug.show { display:flex; }
  .sg { display:flex; align-items:center; gap:10px; width:100%; padding:12px 10px; border-radius:10px; text-align:left; font-size:15.5px; color:#c9d2dc; }
  .sg:active { background:var(--card); } .sg .tx { flex:1; min-width:0; } .sg .tx b { color:var(--teal); font-weight:800; }
  .sg.add { color:var(--teal); font-weight:700; }
  .sg .del { flex-shrink:0; color:var(--mute); font-size:13px; padding:4px 8px; border-radius:8px; } .sg .del:active { background:#2a1416; color:var(--danger); }
  /* monthly tests */
  .lrow2 { display:flex; gap:8px; flex-shrink:0; position:relative; z-index:5; } .lrow2 .pdd { flex:1; min-width:0; }
  .tbtn2 { flex-shrink:0; display:flex; align-items:center; gap:6px; padding:0 14px; border:1px solid var(--edge); background:var(--card); border-radius:14px; font-weight:700; font-size:14px; }
  .tbtn2 svg { width:18px; height:18px; color:var(--teal); }
  #tests .tv { position:fixed; inset:0; z-index:35; background:#0d1116; display:flex; flex-direction:column; }
  .tv-top { flex-shrink:0; display:flex; align-items:center; gap:12px; padding:calc(var(--st) + 12px) 16px 8px; }
  .tvb { width:40px; height:40px; border-radius:50%; background:var(--card); border:1px solid var(--edge); display:grid; place-items:center; flex-shrink:0; }
  .tvb svg { width:20px; height:20px; }
  .tv-top .tt { flex:1; min-width:0; } .tv-top .tt b { display:block; font-size:19px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .tv-top .tt span { font-size:12.5px; color:var(--mute); }
  .tv-body { flex:1; min-height:0; overflow-y:auto; padding:6px 16px 16px; display:flex; flex-direction:column; gap:12px; -webkit-overflow-scrolling:touch; }
  .tv-dock { flex-shrink:0; display:flex; gap:10px; padding:10px 16px calc(var(--sb) + 14px); } .tv-dock > * { flex:1; }
  .trow { flex-shrink:0; display:flex; flex-direction:column; gap:10px; width:100%; text-align:left; padding:14px; background:var(--card); border:1px solid var(--edge); border-radius:16px; }
  .th1 { display:flex; align-items:center; gap:8px; } .th1 b { flex:1; min-width:0; font-size:15.5px; } .th1 .chev { color:var(--mute); font-size:20px; line-height:1; }
  .tstrip { display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; } .tstrip::-webkit-scrollbar { display:none; }
  .tcell { flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:4px; } .tcell i { font-style:normal; font-size:11px; font-weight:700; color:var(--mute); }
  .tcell .ti { width:62px; height:78px; border-radius:10px; background:#0d1116 center/cover no-repeat; border:1px solid var(--edge); display:block; }
  .tcell .tv2 { min-width:60px; min-height:42px; padding:6px 8px; border-radius:10px; background:#0d1116; border:1px solid var(--edge); display:grid; place-items:center; text-align:center;
                font-family:var(--mono); font-size:12.5px; font-weight:600; line-height:1.35; }
  .tcell .none { border-style:dashed; opacity:.6; }
  .tcell.last .ti, .tcell.last .tv2 { border-color:var(--teal); }
  .trend { font-size:12px; font-weight:800; padding:3px 8px; border-radius:8px; } .trend.up { color:#0d1116; background:var(--gain); } .trend.dn { color:#1a0505; background:var(--danger); } .trend.eq { color:var(--mute); background:#0d1116; }
  .tprog { display:flex; gap:4px; flex-shrink:0; } .tprog i { flex:1; height:4px; border-radius:2px; background:var(--edge); } .tprog i.on { background:var(--teal); }
  .twz { margin:auto 0; display:flex; flex-direction:column; gap:16px; padding:10px 0; }
  .twz .tkind { font-size:11.5px; font-weight:800; letter-spacing:.12em; color:var(--teal); } .twz h2 { font-size:26px; line-height:1.2; }

function makeThumb(blob) {

async function loadTakes() {
  const all = await dbAll();
  // takes from the old capture app carry only strokeId; fill in the rest
  all.forEach(t => { if (!t.cat) t.cat = catOfId(t.strokeId); if (!t.sync) t.sync = 'local'; });
  S.takes = all.sort((a, b) => b.createdAt - a.createdAt);
  render();
  for (const t of S.takes.filter(x => !x.thumb && x.blob).slice(0, 40)) {
    t.thumb = await makeThumb(t.blob) || 'none';
    await dbPut(t); render();
  }
}
async function addTake({ strokeId, label, blob, dur, createdAt, quick, fps }) {
  const type = blob.type || 'video/mp4';
  const ext = /quicktime/.test(type) ? 'mov' : type.includes('mp4') ? 'mp4' : 'webm';
  const d = new Date(createdAt || Date.now());
  const sameDay = S.takes.filter(t => t.strokeId === strokeId && dayLabel(t.createdAt) === dayLabel(d.getTime())).length;
  const name = `replay~${strokeId}~${stamp(d)}~${sameDay + 1}${pTag(activeP)}.${ext}`;
  const t = { id:uid(), strokeId, cat:catOfId(strokeId), label, name, blob, size:blob.size, dur:dur || 0, createdAt:d.getTime(), sync:'local', quick:!!quick, fps: fps || 0, player:activeP };
  S.takes.unshift(t);
  await dbPut(t);
  makeThumb(blob).then(async th => { t.thumb = th || 'none'; await dbPut(t); if (S.tab === 'library' && !S.cam && !S.quick) render(); });
  return t;
}

/* ═════════ upload: the phone's share sheet → Save to Files (Drive / iCloud folder) ═════════ */
async function shareTakes(list, markSent = true) {
  const files = list.map(t => new File([t.blob], t.name, { type: t.blob.type || 'video/mp4' }));
  if (navigator.canShare && navigator.canShare({ files })) {
    try {
      await navigator.share({ files });
      if (markSent) { for (const t of list) { t.sync = 'sent'; await dbPut(t); } }
      return true;
    } catch (e) { if (e.name !== 'AbortError') toast('Sharing failed: ' + e.message); return false; }
  }
  // desktop browsers: download instead
  for (const t of list) {
    const a = document.createElement('a'); a.href = blobURL(t); a.download = t.name;
    document.body.appendChild(a); a.click(); a.remove();
  }
  if (markSent) { for (const t of list) { t.sync = 'sent'; await dbPut(t); } }
  return true;
}

    <span class="del" data-sgdel="${p.id}">${S.fdel === p.id ? 'Delete?' : '×'}</span></button>`).join('');

  box.classList.toggle('show', document.activeElement === inp && !!h);
  box.onpointerdown = e => e.preventDefault();   // keep the keyboard up while picking
  box.querySelectorAll('[data-sg]').forEach(b => b.onclick = e => {
    const id = b.dataset.sg;
    if (e.target.closest('[data-sgdel]')) {
      if (S.fdel !== id) { S.fdel = id; focusSuggest(); return; }
      FO.points = FO.points.filter(p => p.id !== id); S.fdel = null; saveFocus(); focusSuggest(); return;

}

/* ═════════ monthly tests: mobility (photos) and endurance (time or reps, optional photos), per person ═════════

const TDEF = {

  const mk = (cat, [name, unit, sides]) => ({ id:cat.slice(0, 3) + '_' + name.toLowerCase().replace(/[^a-z]+/g, '_').replace(/^_|_$/g, '').slice(0, 28), name, unit:unit || 'photo', sides:!!sides });
  return { mobility:TDEF.mobility.map(d => mk('mobility', d)), endurance:TDEF.endurance.map(d => mk('endurance', d)) };

const T = { open:false, cat:'mobility', ex:null, wiz:null, edit:false, photo:null, rows:[], sure:null };

const catOfEx = id => TX.mobility.some(x => x.id === id) ? 'mobility' : 'endurance';
const hasData = e => !!e && (e.v != null || e.l != null || e.r != null || (e.photos && e.photos.length));
const entryOf = (exId, month) => T.rows.find(r => r.ex === exId && r.month === month) || null;

const fmtV = (ex, v) => v == null ? '–' : ex.unit === 'reps' ? String(v) : v >= 60 ? `${Math.floor(v / 60)}:${String(Math.round(v % 60)).padStart(2, '0')}` : `${Math.round(v * 10) / 10}s`;

  if (unit !== 'reps' && str.includes(':')) { const [m, s2] = str.split(':'); const v = (+m || 0) * 60 + (+s2 || 0); return isFinite(v) ? v : null; }
  const v = parseFloat(str); return isFinite(v) ? v : null;

const purls = new Map();

function shrinkImg(im, max, q) {
  const k = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight)), c = document.createElement('canvas');
  c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
  c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);

async function reloadT() { T.rows = (await chkAll()).filter(r => (r.person || '') === activeP); }
function blankEntry(exId, month) { return { id:`${activeP}|${exId}|${month}`, person:activeP, ex:exId, month, v:null, l:null, r:null, photos:[], at:Date.now() }; }

/* ═════════ camera (full takes) ═════════ */
const RES = [[1280,720,'720p'],[1920,1080,'1080p'],[3840,2160,'4K']];
const FPS = [30, 60];
const LIMITS = [[0,'off'],[30,'30s'],[60,'1m'],[300,'5m'],[600,'10m']];
let cfg = { res:1, fps:1, limit:0, lens:'' };
try { Object.assign(cfg, JSON.parse(localStorage.getItem('cap_cfg') || '{}')); } catch (e) {}
const saveCfg = () => { try { localStorage.setItem('cap_cfg', JSON.stringify(cfg)); } catch (e) {} };
let stream = null, lenses = [], facing = 'environment', wake = null;
async function listLenses() {
  try { lenses = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput' && !/front|user|face/i.test(d.label)); } catch (e) { lenses = []; }
}
const lensLabel = d => { const l = (d.label || '').toLowerCase(); return l.includes('ultra') ? '0.5x' : l.includes('tele') ? '3x' : '1x'; };
let idleT = null, streamKey = '';
const streamLive = () => !!stream && stream.getTracks().length > 0 && stream.getTracks().every(t => t.readyState === 'live');
async function startStream() {
  clearTimeout(idleT);
  const [w, h] = RES[cfg.res];
  const key = [cfg.res, cfg.fps, facing, cfg.lens || ''].join('|');
  // a recently used camera is still running: reuse it, so there is no new permission prompt
  if (streamLive() && key === streamKey) {
    document.querySelectorAll('video.live').forEach(v => { v.srcObject = stream; });
    try { wake = await navigator.wakeLock.request('screen'); } catch (e) {}
    return true;
  }
  stopStream();
  try {
    const video = { width:{ ideal:w }, height:{ ideal:h }, frameRate:{ ideal:FPS[cfg.fps] } };
    if (cfg.lens && facing === 'environment') video.deviceId = { exact:cfg.lens }; else video.facingMode = { ideal:facing };
    stream = await navigator.mediaDevices.getUserMedia({ video, audio:true });
    streamKey = key;
    document.querySelectorAll('video.live').forEach(v => { v.srcObject = stream; });
    try { wake = await navigator.wakeLock.request('screen'); } catch (e) {}
    return true;
  } catch (e) { toast('Camera blocked: ' + e.message); return false; }
}
// leaving the camera screen: keep the camera warm for a minute (instant reopen, no new prompt), then switch it off
function parkStream() {
  if (wake) { wake.release().catch(() => {}); wake = null; }
  clearTimeout(idleT);
  idleT = setTimeout(stopStream, 60000);
}
function streamFps() { try { return Math.round(stream.getVideoTracks()[0].getSettings().frameRate) || 0; } catch (e) { return 0; } }
function stopStream() { clearTimeout(idleT); if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } if (wake) { wake.release().catch(() => {}); wake = null; } }
function pickMime() {
  for (const m of ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm']) if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m;
  return '';
}
function makeRecorder(onDone) {
  const chunks = [], mime = pickMime();
  const bps = [8e6, 14e6, 45e6][cfg.res];
  const r = new MediaRecorder(stream, mime ? { mimeType:mime, videoBitsPerSecond:bps } : undefined);
  r.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  r.onstop = () => onDone(chunks.length ? new Blob(chunks, { type:chunks[0].type || mime || 'video/mp4' }) : null);
  r.start(1000);
  return r;
}

function camHtml() {

let recTimer = null, recLimit = null;
async function openCam(catK, label) {
  const hit = cat(catK)[2].find(x => x[1] === label);
  S.cam = { cat:catK, label, strokeId: hit ? hit[0] : idFor(catK, label), rec:false, takes:0, rec0:0 };

  render();

}
function camShutter() {
  const c = S.cam; if (!c || !stream) return;
  if (!c.rec) {
    try { c.recorder = makeRecorder(async blob => {
      if (!blob) return;
      const t = await addTake({ strokeId:c.strokeId, label:c.label, blob, dur:(Date.now() - c.rec0) / 1000, fps:streamFps() });
      c.takes++; toast(`Saved · ${SHORT[c.cat]} ${c.label} · take ${c.takes}`);
      const th = await makeThumb(blob); if (th && S.cam === c) { c.lastThumb = th; render(); }
    }); } catch (e) { toast('Recording not supported: ' + e.message); return; }
    c.rec = true; c.rec0 = Date.now(); render();
    const lim = LIMITS[cfg.limit][0];
    recTimer = setInterval(() => { const el = document.getElementById('camTimer'); const s = (Date.now() - c.rec0) / 1000;
      if (el) el.textContent = lim ? '-' + fmtClock(Math.max(0, lim - s)) : fmtClock(s); }, 250);
    if (lim) recLimit = setTimeout(() => { if (c.rec) camShutter(); }, lim * 1000);
  } else {
    c.recorder.stop(); c.rec = false; clearInterval(recTimer); clearTimeout(recLimit); render();
  }
}

async function openQuick() {

function quickStart() {
  const q = S.quick; if (!q || q.rec || q.mode !== 'live' || !stream) return;

/* ═════════ review player ═════════
   Lives in #review, outside render(): app redraws never restart playback.  */
const RATES = [1, 0.5, 0.25];
const rvEl = () => document.getElementById('review');
const stepOf = t => 1 / (t && t.fps >= 20 ? t.fps : 30);
let hudT = null;
function hud(root, text) { const h = root.querySelector('.rv-hud'); if (!h) return; h.textContent = text; h.classList.add('show'); clearTimeout(hudT); hudT = setTimeout(() => h.classList.remove('show'), 700); }
const fmtT = s => { s = Math.max(0, s || 0); return `${Math.floor(s / 60)}:${pad(Math.floor(s % 60))}.${pad(Math.floor((s % 1) * 100))}`; };

// hold-to-repeat for the frame buttons
function repeatBtn(btn, fn) {
  let t1 = null, t2 = null;
  const stop = () => { clearTimeout(t1); clearInterval(t2); };
  btn.onpointerdown = e => { e.preventDefault(); fn(); t1 = setTimeout(() => { t2 = setInterval(fn, 70); }, 350); };
  btn.onpointerup = btn.onpointerleave = btn.onpointercancel = stop;
  btn.oncontextmenu = e => e.preventDefault();
}
// a jog bar: drag anywhere to seek; returns an updater for the playhead
function jogBar(el, getDur, onSeek) {
  const drag = e => { const r = el.getBoundingClientRect(); onSeek(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * getDur()); };
  el.onpointerdown = e => { el.setPointerCapture(e.pointerId); drag(e); el.onpointermove = drag; };
  el.onpointerup = el.onpointercancel = () => { el.onpointermove = null; };
}
// pinch zoom + two-finger pan + one-finger horizontal jog on a stage
function stageGestures(stage, target, opts) {
  const pts = new Map(); let z = 1, x = 0, y = 0, g = null, lastTap = 0;
  const apply = () => { target.forEach(v => { v.style.transform = `translate(${x}px, ${y}px) scale(${z})`; }); };
  const reset = () => { z = 1; x = 0; y = 0; apply(); };
  stage.onpointerdown = e => {
    stage.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if (pts.size === 1) {
      const now = Date.now();
      if (now - lastTap < 280) { reset(); lastTap = 0; return; }
      lastTap = now;
      g = { mode:'one', x0:e.clientX, y0:e.clientY, t0:opts.time(), moved:false };
    } else if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      g = { mode:'two', d0:Math.hypot(a.x - b.x, a.y - b.y), z0:z, cx:(a.x + b.x) / 2, cy:(a.y + b.y) / 2, x0:x, y0:y };
    }
  };
  stage.onpointermove = e => {
    if (!pts.has(e.pointerId) || !g) return;
    pts.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if (g.mode === 'one' && pts.size === 1) {
      const dx = e.clientX - g.x0, dy = e.clientY - g.y0;
      if (!g.moved && Math.hypot(dx, dy) < 8) return;
      if (!g.moved) { g.moved = true; g.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y'; if (g.axis === 'x') opts.pause(); }
      if (g.axis === 'x') { opts.seek(g.t0 + dx / stage.clientWidth * 2); }          // one screen width = 2 s
      else if (z === 1 && dy > 0) stage.style.transform = `translateY(${dy}px)`;       // pull down to close
      else if (z > 1) { x += e.movementX || 0; y += e.movementY || 0; apply(); }
    } else if (g.mode === 'two' && pts.size === 2) {
      const [a, b] = [...pts.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y), cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
      const r = stage.getBoundingClientRect();
      const nz = Math.max(1, Math.min(5, g.z0 * d / g.d0));
      // keep the point between the fingers where it was
      x = cx - r.left - (g.cx - r.left - g.x0) * nz / g.z0; y = cy - r.top - (g.cy - r.top - g.y0) * nz / g.z0; z = nz;
      if (z === 1) { x = 0; y = 0; }
      apply();
    }
  };
  const up = e => {
    pts.delete(e.pointerId);
    if (g && g.mode === 'one' && g.axis === 'y' && z === 1) {
      const dy = e.clientY - g.y0; stage.style.transform = '';
      if (dy > 110 && opts.close) { opts.close(); return; }
    }
    if (g && g.mode === 'one' && !g.moved && opts.tap) setTimeout(() => { if (lastTap && Date.now() - lastTap >= 270) opts.tap(); }, 290);
    if (pts.size === 0) g = null;
  };
  stage.onpointerup = up; stage.onpointercancel = up;
  return { reset };
}

/* ═════════ friends & clip messages (Cloudflare Worker + KV, 48 h) ═════════ */
const DEFAULT_SERVER = 'https://replayproxy.razaplaza-video.workers.dev';
const LS = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } };
const LSset = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const M = { me: LS('smaesh_me', ''), server: LS('smaesh_server', DEFAULT_SERVER), friends: LS('smaesh_friends', []),
            received: [], sent: [], loaded: false, error: '', busy: false };
const nk = s => String(s || '').trim().toLowerCase().replace(/[^a-z0-9æøå]+/g, '-').replace(/^-|-$/g, '').slice(0, 24);
const HUES = ['#3fd2c7','#ff8a3d','#6aa9ff','#4ee39a','#ffb547','#c49bff','#ff6b8b'];
const hue = n => HUES[[...nk(n)].reduce((a, c) => a + c.charCodeAt(0), 0) % HUES.length];
const initials = n => String(n).trim().split(/\s+/).map(w => w[0] || '').join('').slice(0, 2).toUpperCase() || '?';
const ago = ts => { const m = Math.round((Date.now() - ts) / 6e4); return m < 1 ? 'now' : m < 60 ? m + 'm' : m < 1440 ? Math.round(m / 60) + 'h' : Math.round(m / 1440) + 'd'; };
const unread = () => M.received.filter(x => !x.opened).length;
const api = (path, opt) => fetch(M.server.replace(/\/+$/, '') + path, opt).then(async r => { const j = r.headers.get('content-type')?.includes('json') ? await r.json() : null;
  if (!r.ok) throw new Error((j && j.error) || ('server ' + r.status)); return j || r; });
function addFriend(name) {
  name = String(name || '').trim().slice(0, 24); if (!name || nk(name) === nk(M.me)) return;
  if (!M.friends.some(f => nk(f) === nk(name))) { M.friends.push(name); LSset('smaesh_friends', M.friends); }
}
async function refreshInbox(quiet) {
  if (!M.me || M.busy) return;
  M.busy = true;
  try {
    const j = await api('/inbox?me=' + encodeURIComponent(M.me));
    M.received = j.received || []; M.sent = j.sent || []; M.loaded = true; M.error = '';
    M.received.forEach(x => addFriend(x.fromName || x.from));
  } catch (e) { M.error = e.message; if (!quiet) toast('Inbox: ' + e.message); }
  M.busy = false;
  if (S.tab === 'inbox' || S.tab === 'me' || !quiet) render(); else render();
}
let inboxTimer = null;
function pollInbox() {
  clearInterval(inboxTimer);
  // only while the inbox is on screen: the free plan allows ~500 checks a day
  if (S.tab === 'inbox' && document.visibilityState === 'visible') inboxTimer = setInterval(() => refreshInbox(true), 30000);
}
async function sendToFriend(to, blob, note) {
  if (!M.me) { toast('Pick your name in Me first'); return false; }
  if (blob && blob.size > 24 * 1024 * 1024) { toast('Too big to send (max 24 MB) · try a quick clip'); return false; }
  toast(`Sending to ${to}…`);

    await api(`/send?from=${encodeURIComponent(M.me)}&to=${encodeURIComponent(to)}&note=${encodeURIComponent(note || '')}`,

}

function inboxScreen() {
  let h = `<div class="top"><span class="word">Inbox</span><span class="tact">
    <button class="iconbtn" data-ib="refresh" aria-label="Refresh">${I.refresh}</button></span></div><div class="body">`;
  if (!M.me) return h + nameCard() + `</div>` + tabs();
  if (M.error && !M.loaded) h += `<div class="card"><h3>Can't reach the inbox</h3><p>${esc(M.error)}</p><p>Check the server in <b>Me</b>.</p></div>`;
  // one row per person, newest activity first
  const people = new Map();
  M.received.forEach(x => { const k = x.from; const p = people.get(k) || { name:x.fromName || x.from, rec:[], sent:[] }; p.rec.push(x); people.set(k, p); });
  M.sent.forEach(x => { const k = x.to; const p = people.get(k) || { name:x.toName || x.to, rec:[], sent:[] }; p.sent.push(x); people.set(k, p); });
  M.friends.forEach(f => { if (!people.has(nk(f))) people.set(nk(f), { name:f, rec:[], sent:[] }); });

    const fresh = p.rec.filter(x => !x.opened);
    return { ...p, last, fresh };

  rows.forEach(r => {

/* snap viewer for received clips */
async function openSnaps(person, replay) {
  const mine = M.received.filter(x => x.from === person).sort((a, b) => a.ts - b.ts);
  let list = replay ? mine.slice(-1) : mine.filter(x => !x.opened);
  if (!list.length) list = mine.slice(-1);
  const name = (mine[0] && (mine[0].fromName || mine[0].from)) || person;
  if (!list.length) { openQuick(); S.quick.to = name; return; }
  const d = document.createElement('div'); d.className = 'snapv';
  d.innerHTML = `<div class="bars">${list.map(() => '<i><b></b></i>').join('')}</div>
    <div class="head"><span class="av" style="background:${hue(name)}">${esc(initials(name))}</span><span><b>${esc(name)}</b><span id="snMeta"></span></span>
      <span style="flex:1"></span><button class="fb" data-sn="save" aria-label="Save to Library">${I.save}</button><button class="fb" data-sn="x" aria-label="Close">×</button></div>
    <div id="snBody"></div>`;
  document.body.appendChild(d);
  let i = 0, raf = 0, cur = null, timer = null, urls = [];
  const bars = [...d.querySelectorAll('.bars b')];
  const close = () => { cancelAnimationFrame(raf); clearTimeout(timer); urls.forEach(u => URL.revokeObjectURL(u)); d.remove(); refreshInbox(true); };
  const done = () => {
    cancelAnimationFrame(raf);
    const r = document.createElement('div'); r.className = 'rsheet';
    r.innerHTML = `<div class="mh" style="padding:0">Reply to ${esc(name)}</div>
      <div class="chips2">${['Got it 👍', 'Looks good!', 'Try it again', 'Can you film it closer?'].map(q => `<button data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>
      <button class="bigbtn" data-rc>${I.send}Reply with a clip</button><button class="bigbtn ghost" data-again>Watch again</button>`;
    r.querySelectorAll('[data-q]').forEach(b => b.onclick = async () => { close(); await sendToFriend(name, null, b.dataset.q); });
    r.querySelector('[data-rc]').onclick = () => { close(); openQuick(); S.quick.to = name; };
    r.querySelector('[data-again]').onclick = () => { r.remove(); show(0); };
    d.appendChild(r);
  };
  async function show(k) {
    cancelAnimationFrame(raf); clearTimeout(timer); i = k; cur = list[i];
    bars.forEach((b, j) => b.style.width = j < i ? '100%' : '0%');
    d.querySelector('#snMeta').textContent = ago(cur.ts) === 'now' ? 'just now' : ago(cur.ts) + ' ago';
    const body = d.querySelector('#snBody');
    if (!cur.opened) api('/opened?id=' + cur.id, { method:'POST' }).catch(() => {}), cur.opened = true;
    if (!cur.size) {                                      // a text reply
      body.innerHTML = `<div class="textonly">${esc(cur.note)}</div>`;
      const t0 = performance.now();
      const tick = () => { const p = Math.min(1, (performance.now() - t0) / 2500); bars[i].style.width = p * 100 + '%'; if (p < 1) raf = requestAnimationFrame(tick); else next(); };
      raf = requestAnimationFrame(tick); return;
    }
    body.innerHTML = `<div class="loading">Loading…</div>`;
    try {
      if (!cur.url) { const r = await api('/clip?id=' + cur.id); cur.blob = await r.blob(); cur.url = URL.createObjectURL(cur.blob); urls.push(cur.url); }
    } catch (e) { body.innerHTML = `<div class="loading">This clip has expired</div>`; timer = setTimeout(next, 1500); return; }
    if (list[i] !== cur) return;
    body.innerHTML = `<video src="${cur.url}" autoplay playsinline></video>${cur.note ? `<div class="note-card">${esc(cur.note)}</div>` : ''}`;
    const v = body.querySelector('video');
    v.play().catch(() => { v.muted = true; v.play().catch(() => {}); });
    const tick = () => { if (v.duration) bars[i].style.width = (v.currentTime / v.duration * 100) + '%'; raf = requestAnimationFrame(tick); };
    raf = requestAnimationFrame(tick);
    v.onended = next;
  }
  const next = () => { if (i < list.length - 1) show(i + 1); else { bars[i].style.width = '100%'; done(); } };
  const prev = () => show(Math.max(0, i - 1));
  d.querySelector('[data-sn=x]').onclick = close;
  d.querySelector('[data-sn=save]').onclick = async () => {
    if (!cur || !cur.blob) { toast('Nothing to save yet'); return; }
    await addTake({ strokeId:'quick', label:'From ' + name + (cur.note ? ' · ' + cur.note : ''), blob:cur.blob, dur:0, quick:true });
    toast('Saved to Library');
  };
  // tap right = next, tap left = back, hold = pause
  let holdT = null, held = false;
  d.addEventListener('pointerdown', e => { if (e.target.closest('button,.rsheet')) return; held = false; holdT = setTimeout(() => { held = true; const v = d.querySelector('video'); v && v.pause(); }, 220); });
  d.addEventListener('pointerup', e => {
    if (e.target.closest('button,.rsheet')) return; clearTimeout(holdT);
    const v = d.querySelector('video');
    if (held) { v && v.play(); return; }
    if (d.querySelector('.rsheet')) return;
    e.clientX < innerWidth / 3 ? prev() : next();
  });
  show(0);
}

  $$('.thumb[data-t]').forEach(b => {
    let tm = null;
    b.onpointerdown = () => { if (S.sel) return; tm = setTimeout(() => { tm = null; S.sel = new Set([b.dataset.t]); S.delSure = false; b._held = true; render(); }, 450); };
    b.onpointerup = b.onpointerleave = b.onpointercancel = () => { if (tm) clearTimeout(tm); tm = null; };
    b.oncontextmenu = e => e.preventDefault();
    b.onclick = () => {
      if (b._held) { b._held = false; return; }
      if (!S.sel) { const list = libList(); openReview(list, list.findIndex(t => t.id === b.dataset.t)); return; }
      S.sel.has(b.dataset.t) ? S.sel.delete(b.dataset.t) : S.sel.add(b.dataset.t);
      S.delSure = false; if (!S.sel.size) S.sel = null; render();
    };
  });
  $$('[data-cmp]').forEach(b => b.onclick = () => {
    const [x, y] = S.takes.filter(t => S.sel.has(t.id)); S.sel = null; S.delSure = false; render(); openCompare(x, y);
  });
  $$('[data-cancel]').forEach(b => b.onclick = () => { S.sel = null; S.delSure = false; render(); });
  $$('[data-up]').forEach(b => b.onclick = async () => {
    const list = S.takes.filter(t => S.sel.has(t.id));
    if (await shareTakes(list)) { S.sel = null; toast(`Uploaded ${list.length}`); render(); }
  });
  $$('[data-del]').forEach(b => b.onclick = async () => {
    if (!S.delSure) { S.delSure = true; render(); return; }
    const ids = [...S.sel]; for (const id of ids) await dbDel(id);
    S.takes = S.takes.filter(t => !S.sel.has(t.id)); S.sel = null; S.delSure = false; render(); toast(`Deleted ${ids.length}`);
  });
  $$('[data-clearsent]').forEach(b => b.onclick = async () => {
    if (!S.clearSure) { S.clearSure = true; render(); return; }
    const gone = S.takes.filter(t => t.sync === 'sent'); for (const t of gone) await dbDel(t.id);
    S.takes = S.takes.filter(t => t.sync !== 'sent'); S.clearSure = false; render(); toast(`Freed ${gone.length} clips`);
  });
  $$('[data-pl]').forEach(b => b.onclick = async () => {
    const t = S.takes.find(x => x.id === S.player.id), a = b.dataset.pl;
    if (a === 'close') { S.player = null; render(); }
    else if (a === 'share') { if (await shareTakes([t])) { toast('Uploaded'); render(); } }
    else if (a === 'del') {
      if (!S.player.sure) { S.player.sure = true; render(); return; }
      await dbDel(t.id); S.takes = S.takes.filter(x => x.id !== t.id); S.player = null; render(); toast('Deleted');
    }
  });

  // camera
  $$('[data-shut]').forEach(b => b.onclick = camShutter);
  $$('[data-camback]').forEach(b => b.onclick = closeCam);
  $$('[data-camlib]').forEach(b => b.onclick = () => {
    const c = S.cam; if (!c || c.rec) return;
    parkStream(); S.cam = null; S.tab = 'library';
    S.sec = STROKE.includes(c.cat) ? 'strokes' : c.cat === 'match' ? 'matches' : 'drills'; S.filter = STROKE.includes(c.cat) ? c.cat : 'all';
    render();
  });
  $$('[data-flip]').forEach(b => b.onclick = () => {
    if ((S.cam && S.cam.rec) || (S.quick && S.quick.rec)) return;
    facing = facing === 'environment' ? 'user' : 'environment'; startStream();
  });
  $$('[data-o]').forEach(b => b.onclick = () => {
    const k = b.dataset.o;
    if (k === 'lens') { if (lenses.length < 2) return; const i = lenses.findIndex(d => d.deviceId === cfg.lens); cfg.lens = lenses[(i + 1) % lenses.length].deviceId; }
    else cfg[k] = (cfg[k] + 1) % (k === 'res' ? RES : k === 'fps' ? FPS : LIMITS).length;
    saveCfg(); render(); startStream();
  });
  // quick camera
  const ring = document.getElementById('ring');
  if (ring) { ring.onpointerdown = e => { e.preventDefault(); quickStart(); }; ring.oncontextmenu = e => e.preventDefault(); }
  $$('[data-q]').forEach(b => b.onclick = async () => {
    const a = b.dataset.q;
    if (a === 'back') { parkStream(); S.quick = null; render(); }
    else if (a === 'discard') { if (!S.quick.saved) toast('Discarded'); quickReset(); }
    else if (a === 'save') { await quickSave(); toast('Saved to Library'); }
    else if (a === 'send') { const q = S.quick; openSendSheet(q.blob, q.to, () => { if (S.quick === q) quickReset(); }); }
  });
}
/* ═════════ tripod remote ═════════
   Most clip-on Bluetooth remotes behave like a tiny keyboard: the button presses Enter, Volume Up, Media Play…
   One press starts recording, the next one stops it. (An iPhone-mode remote sends Volume Up in a way web pages can't see.) */
let remoteOn = (() => { try { return localStorage.getItem('smaesh_remote') !== '0'; } catch (e) { return true; } })();
const REMOTE_KEYS = ['Enter', ' ', 'AudioVolumeUp', 'AudioVolumeDown', 'VolumeUp', 'VolumeDown', 'MediaPlayPause', 'MediaPlay', 'MediaPause', 'MediaStop', 'MediaTrackNext', 'MediaTrackPrevious', 'PageUp', 'PageDown'];
let remoteAt = 0, lastKey = null;
function remotePress() {
  if (!remoteOn || Date.now() - remoteAt < 800) return;      // remotes often repeat
  if (S.cam) { remoteAt = Date.now(); camShutter(); }
  else if (S.quick && S.quick.mode === 'live') { remoteAt = Date.now(); if (S.quick.rec) quickStop(); else quickStart(); }
}
window.addEventListener('keydown', e => {
  lastKey = { key:e.key, code:e.code };
  const ro = document.getElementById('remoteKey');
  if (ro) ro.textContent = `${e.key === ' ' ? 'Space' : e.key}${e.code ? ' (' + e.code + ')' : ''}`;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test((e.target || {}).tagName)) return;
  if (!(S.cam || (S.quick && S.quick.mode === 'live'))) return;
  if (REMOTE_KEYS.includes(e.key) || e.key === 'Unidentified') { e.preventDefault(); remotePress(); }
}, true);
try { if ('mediaSession' in navigator) ['play', 'pause', 'stop', 'nexttrack', 'previoustrack'].forEach(a => navigator.mediaSession.setActionHandler(a, () => remotePress())); } catch (e) {}
window.addEventListener('pointerup', () => { if (S.quick && S.quick.rec) quickStop(); });
window.addEventListener('pointercancel', () => { if (S.quick && S.quick.rec) quickStop(); });
document.addEventListener('visibilitychange', () => {
  pollInbox(); if (document.visibilityState === 'visible') refreshInbox(true);
  // the camera doesn't survive the app going to the background: stop cleanly
  if (document.visibilityState === 'hidden') {
    if (S.cam && S.cam.rec) camShutter();
    if (S.quick && S.quick.rec) quickStop();
    if (!S.cam && !S.quick) stopStream();
  } else if ((S.cam || (S.quick && S.quick.mode === 'live')) && !streamLive()) startStream();
});

if ('serviceWorker' in navigator) {
  // check for a new version on every launch and whenever the app comes back
  // to the foreground; when one takes over, reload into it (never mid-take)
  navigator.serviceWorker.register('sw.js', { updateViaCache:'none' }).then(reg => {
    reg.update().catch(() => {});
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
  }).catch(() => {});
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloaded) return;
    const busy = (S.cam && S.cam.rec) || (S.quick && S.quick.rec);
    if (!busy) { reloaded = true; location.reload(); }
  });
}
render();
loadTakes();
refreshInbox(true);
</script>
</body>
</html>
