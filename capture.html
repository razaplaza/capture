<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<title>Smæsh</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#11161c" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#e8eef2; --mute:#7d8a96; --line:#243039; --card:#1a222b; --edge:#2a3642;
    --teal:#3fd2c7; --teal-d:#2fb8ad; --gain:#4ee39a; --rec:#ff5a4f; --warn:#ffb547; --danger:#ff6b6b;
    --ui:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
    --st:env(safe-area-inset-top, 0px); --sb:env(safe-area-inset-bottom, 0px);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden] { display:none !important; }
  html, body { height:100%; }
  body { font-family:var(--ui); color:var(--ink); font-size:15px; overflow:hidden; -webkit-font-smoothing:antialiased;
         background:radial-gradient(120% 60% at 50% 0%, #1b2530 0%, #11161c 55%, #0d1116 100%) fixed, #0d1116;
         user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  button { font:inherit; color:inherit; border:0; background:none; cursor:pointer; }
  input { font:inherit; }
  svg { width:22px; height:22px; flex-shrink:0; }
  .app { position:fixed; inset:0; display:flex; flex-direction:column; }
  .top { padding:calc(var(--st) + 14px) 20px 6px; display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .top .word { font-weight:700; font-size:28px; letter-spacing:-.02em; }
  .top .tact { margin-left:auto; display:flex; gap:8px; }
  .iconbtn { width:42px; height:42px; border-radius:12px; background:var(--card); border:1px solid var(--edge); display:grid; place-items:center; position:relative; }
  .iconbtn input { position:absolute; inset:0; opacity:0; }
  .body { flex:1; min-height:0; overflow-y:auto; padding:10px 18px 20px; display:flex; flex-direction:column; gap:14px; -webkit-overflow-scrolling:touch; }
  .lab { font-size:11.5px; font-weight:700; letter-spacing:.08em; color:var(--mute); }
  .tabs { flex-shrink:0; background:#131a21; border-top:1px solid var(--line); display:grid; grid-template-columns:repeat(3,1fr);
          align-items:center; padding:8px 0 calc(var(--sb) + 8px); }
  .tab { display:flex; flex-direction:column; align-items:center; gap:4px; font-size:11px; color:var(--mute); position:relative; }
  .tab.on { color:var(--teal); }
  .tab .dot { position:absolute; top:-3px; right:calc(50% - 18px); min-width:17px; height:17px; border-radius:9px; background:var(--warn); color:#1a1200;
              font-size:10px; font-weight:800; display:grid; place-items:center; padding:0 4px; }
  .tab.mid { margin-top:-30px; touch-action:none; }
  .tab.mid i { width:66px; height:66px; border-radius:50%; background:radial-gradient(circle at 40% 30%, #56e3d8, #2aa99f); display:grid; place-items:center;
               box-shadow:0 0 0 6px #131a21, 0 8px 24px rgba(63,210,199,.35); transition:transform .15s; }
  .tab.mid i::after { content:''; width:24px; height:24px; border-radius:50%; background:var(--rec); box-shadow:0 0 0 3px #062825; }
  .tab.mid.on i { box-shadow:0 0 0 6px #131a21, 0 0 0 8px var(--teal), 0 8px 24px rgba(63,210,199,.35); }
  .tab.mid:active i { transform:scale(.94); }

  /* record: big tiles that expand */
  .banner { display:flex; align-items:center; gap:12px; background:linear-gradient(90deg,#1f2a35,#1a232d); border:1px solid var(--teal); border-radius:14px; padding:12px 14px; }
  .banner b { flex:1; font-size:14.5px; } .banner button { color:var(--mute); font-weight:600; font-size:13px; }
  .cats { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px; }
  .cat { display:flex; align-items:center; gap:12px; padding:18px 15px; border-radius:18px; background:var(--card); border:1px solid var(--edge);
         font-weight:600; font-size:16px; min-width:0; text-align:left; }
  .cat svg { width:34px; height:34px; color:var(--teal); stroke-width:1.6; }
  .cat .n { margin-left:auto; font-family:var(--mono); font-size:12px; color:var(--mute); font-weight:500; }
  .cat.on { border-color:var(--teal); background:rgba(63,210,199,.1); }
  .drawer { grid-column:1/-1; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; padding:12px; border-radius:14px;
            background:#141b22; border:1px solid var(--edge); animation:open .18s ease-out; min-width:0; }
  @keyframes open { from { opacity:0; transform:translateY(-4px); } }
  .opt { border:1px solid var(--edge); background:var(--card); border-radius:11px; padding:13px 6px; font-weight:600; font-size:14.5px; text-align:center; line-height:1.2; }
  .opt:active { border-color:var(--teal); color:var(--teal); }
  .opt.hold { border-color:var(--teal); transform:scale(.96); transition:transform .3s; }
  .opt.add { border:1px dashed var(--teal); background:rgba(63,210,199,.06); color:var(--teal); font-size:22px; font-weight:500; line-height:1; }
  .new { border:1px solid var(--teal); background:#0d1116; color:var(--ink); border-radius:11px; padding:10px 8px; font-size:15px; font-weight:600;
         min-width:0; outline:none; text-align:center; user-select:text; -webkit-user-select:text; }
  .quick { display:flex; flex-wrap:wrap; gap:8px; }
  .quick .opt { padding:10px 14px; }

  /* library */
  .seg { display:grid; grid-auto-flow:column; grid-auto-columns:1fr; background:#1a222b; border:1px solid var(--edge); border-radius:12px; padding:3px; flex-shrink:0; }
  .seg button { padding:9px 0; font-size:12px; font-weight:700; letter-spacing:.05em; color:var(--mute); border-radius:9px; }
  .seg button.on { background:linear-gradient(90deg,var(--teal-d),var(--teal)); color:#062825; }
  .chips { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:5px; flex-shrink:0; }
  .chip { border:1px solid var(--edge); background:var(--card); border-radius:999px; padding:8px 0; font-size:12.5px; font-weight:600; color:var(--mute); }
  .chip.on { background:var(--teal); color:#062825; border-color:var(--teal); }
  .up { display:flex; align-items:center; gap:12px; background:linear-gradient(90deg,#1f2a35,#1a232d); border:1px solid var(--edge); border-radius:14px; padding:11px 12px; flex-shrink:0; }
  .up .bi { width:36px; height:36px; border-radius:10px; background:#11161c; display:grid; place-items:center; color:var(--teal); }
  .up b { font-size:14.5px; } .up .go { margin-left:auto; background:var(--teal); color:#062825; font-weight:700; border-radius:10px; padding:10px 14px; font-size:13.5px; }
  .ghead { display:flex; align-items:baseline; gap:8px; } .ghead b { font-size:15px; } .ghead span { font-family:var(--mono); font-size:11.5px; color:var(--mute); }
  .g3 { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; }
  .thumb { position:relative; border-radius:12px; overflow:hidden; aspect-ratio:3/4; background:#1c2530 center/cover no-repeat; text-align:left; }
  .thumb.wide { aspect-ratio:16/10; width:128px; flex-shrink:0; }
  .thumb .d { position:absolute; left:6px; bottom:6px; font-family:var(--mono); font-size:10.5px; padding:1px 6px; border-radius:5px; background:rgba(0,0,0,.6); }
  .thumb .k { position:absolute; left:6px; top:6px; right:32px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:10.5px; font-weight:700;
              padding:2px 7px; border-radius:6px; background:rgba(13,17,22,.8); }
  .sync { position:absolute; right:6px; top:6px; width:21px; height:21px; border-radius:50%; display:grid; place-items:center; background:rgba(13,17,22,.8); }
  .sync svg { width:12px; height:12px; } .sync.local { color:var(--mute); } .sync.sent { color:var(--gain); }
  .thumb.sel { outline:3px solid var(--teal); outline-offset:-3px; }
  .thumb .tick { position:absolute; right:6px; top:6px; width:22px; height:22px; border-radius:50%; background:var(--teal); color:#062825; display:grid; place-items:center; font-weight:800; font-size:12px; }
  .thumb .tick.off { background:rgba(13,17,22,.8); border:2px solid var(--mute); }
  .mcard { display:flex; align-items:center; gap:14px; padding:10px; border-radius:16px; background:var(--card); border:1px solid var(--edge); }
  .mcard .mt b { display:block; font-size:16px; } .mcard .mt span { display:block; margin-top:3px; font-size:12.5px; color:var(--mute); }
  .actionbar { flex-shrink:0; display:flex; gap:8px; padding:12px 16px calc(var(--sb) + 12px); background:#131a21; border-top:1px solid var(--line); }
  .actionbar button { flex:1; border:1px solid var(--edge); background:var(--card); border-radius:12px; padding:13px 8px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:7px; }
  .actionbar .primary { background:var(--teal); color:#062825; border-color:var(--teal); }
  .actionbar .danger { color:var(--danger); } .actionbar .danger.sure { background:var(--danger); color:#1a0505; border-color:var(--danger); }
  .actionbar svg { width:18px; height:18px; }
  .empty { margin:auto; text-align:center; color:var(--mute); display:flex; flex-direction:column; align-items:center; gap:12px; }
  .empty svg { width:42px; height:42px; color:var(--edge); }
  .empty button { background:var(--teal); color:#062825; font-weight:700; border-radius:12px; padding:12px 18px; }

  /* settings */
  .card { background:var(--card); border:1px solid var(--edge); border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .card h3 { font-size:16px; } .card p { color:var(--mute); line-height:1.5; font-size:14px; }
  .card ol { padding-left:20px; color:var(--mute); line-height:1.6; font-size:14px; display:flex; flex-direction:column; gap:4px; }
  .card ol b { color:var(--ink); font-weight:600; }
  .stat { display:flex; justify-content:space-between; font-size:14px; } .stat span { color:var(--mute); } .stat b { font-family:var(--mono); font-weight:500; }
  .wide-btn { border:1px solid var(--edge); background:#141b22; border-radius:12px; padding:13px; font-weight:700; }
  .wide-btn.danger { color:var(--danger); } .wide-btn.sure { background:var(--danger); color:#1a0505; border-color:var(--danger); }

  /* camera */
  .cam { position:fixed; inset:0; z-index:20; background:#000; display:flex; flex-direction:column; touch-action:none; }
  .cam video.live, .cam video.loop { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .ctop { position:relative; z-index:2; padding:calc(var(--st) + 12px) 14px 30px; display:flex; align-items:center; gap:8px;
          background:linear-gradient(rgba(0,0,0,.5), transparent); }
  .pill { border-radius:10px; background:rgba(17,22,28,.8); border:1px solid var(--edge); font-size:14px; font-weight:600; padding:7px 12px; }
  .pill.label { background:linear-gradient(90deg,var(--teal-d),var(--teal)); color:#062825; border-color:transparent; }
  .timer { margin-left:auto; font-family:var(--mono); font-size:16px; color:var(--ink); background:rgba(17,22,28,.85); border:1px solid var(--edge); padding:6px 11px; border-radius:10px; }
  .timer.rec { color:var(--gain); } .timer.rec::before { content:''; display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--rec); margin-right:7px; vertical-align:middle; }
  .cbtn { width:42px; height:42px; border-radius:12px; background:rgba(17,22,28,.8); border:1px solid var(--edge); display:grid; place-items:center; color:var(--ink); }
  .opts { position:relative; z-index:2; margin-top:auto; display:flex; justify-content:center; gap:7px; flex-wrap:wrap; padding:0 12px 16px; }
  .ochip { border-radius:10px; background:rgba(17,22,28,.8); border:1px solid var(--edge); color:var(--teal); font-family:var(--mono); font-size:12.5px; padding:7px 11px; }
  .ochip span { color:var(--mute); margin-right:5px; }
  .cbot { position:relative; z-index:2; display:flex; align-items:center; justify-content:center; gap:46px; padding:4px 0 calc(var(--sb) + 26px);
          background:linear-gradient(transparent, rgba(0,0,0,.55) 40%); }
  .shut { width:84px; height:84px; border-radius:50%; border:4px solid var(--teal); display:grid; place-items:center; box-shadow:0 0 24px rgba(63,210,199,.35); }
  .shut i { width:62px; height:62px; border-radius:50%; background:var(--rec); transition:all .15s; }
  .shut.on i { width:30px; height:30px; border-radius:8px; }
  .side { width:48px; height:48px; border-radius:14px; background:rgba(17,22,28,.8) center/cover no-repeat; border:1px solid var(--edge); color:var(--teal);
          font-size:13px; font-weight:700; display:grid; place-items:center; }
  /* quick camera */
  .ring { position:relative; width:96px; height:96px; touch-action:none; }
  .ring svg { position:absolute; inset:0; width:96px; height:96px; transform:rotate(-90deg); }
  .ring .bg { fill:none; stroke:rgba(255,255,255,.9); stroke-width:6; }
  .ring .fg { fill:none; stroke:var(--rec); stroke-width:6; stroke-linecap:round; stroke-dasharray:283; stroke-dashoffset:283; }
  .ring i { position:absolute; inset:14px; border-radius:50%; background:rgba(255,255,255,.18); transition:transform .15s, background .15s; }
  .ring.on i { background:var(--rec); transform:scale(.72); }
  .qtip { position:relative; z-index:2; align-self:center; margin:auto 0 14px; font-size:13px; font-weight:600; background:rgba(0,0,0,.45); padding:6px 12px; border-radius:999px; }
  .pbar { position:relative; z-index:2; margin-top:auto; display:flex; gap:10px; padding:0 16px calc(var(--sb) + 22px); }
  .pbar button { border-radius:999px; height:56px; font-weight:700; font-size:16px; display:flex; align-items:center; justify-content:center; gap:8px; }
  .pbar .save { background:rgba(0,0,0,.55); color:#fff; padding:0 22px; border:1px solid rgba(255,255,255,.2); }
  .pbar .save.done { color:var(--gain); }
  .pbar .send { flex:1; background:var(--teal); color:#062825; }
  .pbar svg { width:20px; height:20px; }
  .xbtn { width:42px; height:42px; border-radius:50%; background:rgba(0,0,0,.45); color:#fff; font-size:24px; line-height:1; display:grid; place-items:center; }

  /* player + sheets */
  .player { position:fixed; inset:0; z-index:30; background:#000; display:flex; flex-direction:column; }
  .player video { flex:1; min-height:0; width:100%; object-fit:contain; background:#000; }
  .player .ctop { background:none; }
  .player .pbar { margin-top:0; padding-top:12px; }
  .menu { position:fixed; inset:0; z-index:40; background:rgba(5,8,10,.55); display:flex; flex-direction:column; justify-content:flex-end; }
  .sheet { background:#141b22; border-top:1px solid var(--edge); border-radius:22px 22px 0 0; padding:14px 18px calc(var(--sb) + 22px); display:flex; flex-direction:column; gap:10px; animation:up .2s ease-out; }
  @keyframes up { from { transform:translateY(30px); opacity:0; } }
  .sheet .grab { width:40px; height:4px; border-radius:2px; background:var(--edge); align-self:center; }
  .mh { font-size:18px; font-weight:700; text-align:center; padding:4px 0 6px; }
  .act { display:flex; align-items:center; justify-content:center; border:1px solid var(--edge); background:var(--card); border-radius:14px; padding:15px; font-size:16px; font-weight:600; }
  .act.danger { color:var(--danger); } .act.primary { background:var(--teal); color:#062825; border-color:var(--teal); } .act.plain { background:none; border-color:transparent; color:var(--mute); }
  .menu input { background:#0d1116; border:1px solid var(--teal); border-radius:14px; padding:15px; color:var(--ink); font-size:17px; font-weight:600; outline:none; text-align:center;
                user-select:text; -webkit-user-select:text; }

  /* ═════ review player + compare ═════ */
  .rv { position:fixed; inset:0; z-index:35; background:#000; display:flex; flex-direction:column; touch-action:none; }
  .rv-top { position:absolute; left:0; right:0; top:0; z-index:3; padding:calc(var(--st) + 10px) 12px 26px; display:flex; align-items:center; gap:8px;
            background:linear-gradient(rgba(0,0,0,.6), transparent); }
  .rv-name { position:absolute; left:12px; top:calc(var(--st) + 62px); max-width:calc(100vw - 24px) !important; }
  .rv-top .pill { max-width:42vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rv-nav { display:flex; align-items:center; border-radius:10px; background:rgba(17,22,28,.8); border:1px solid var(--edge); }
  .rv-nav button { width:34px; height:40px; display:grid; place-items:center; color:var(--ink); }
  .rv-nav button:disabled { color:#3a4652; }
  .rv-nav span { font-family:var(--mono); font-size:12.5px; min-width:44px; text-align:center; }
  .rv-top .sp { flex:1; }
  .rv-cmp { display:flex; align-items:center; gap:6px; height:42px; padding:0 12px; border-radius:12px; background:var(--teal); color:#062825; font-weight:700; font-size:14px; }
  .rv-cmp svg { width:18px; height:18px; }
  .rv-stage { position:relative; flex:1; min-height:0; overflow:hidden; }
  .rv-stage video { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; transform-origin:0 0; will-change:transform; }
  .rv-hud { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:2; pointer-events:none; font-family:var(--mono); font-weight:600;
            background:rgba(0,0,0,.6); padding:8px 14px; border-radius:12px; font-size:16px; opacity:0; transition:opacity .2s; }
  .rv-hud.show { opacity:1; }
  .rv-dock { flex-shrink:0; background:#0d1116; border-top:1px solid var(--line); padding:12px 14px calc(var(--sb) + 12px); display:flex; flex-direction:column; gap:12px; }
  .jog { position:relative; height:44px; border-radius:12px; background:#141b22; border:1px solid var(--edge); overflow:hidden; touch-action:none; }
  .jog .ticks { position:absolute; inset:0; background:repeating-linear-gradient(90deg, rgba(255,255,255,.08) 0 1px, transparent 1px 12px); }
  .jog .ab { position:absolute; top:0; bottom:0; background:rgba(63,210,199,.18); border-left:2px solid var(--teal); border-right:2px solid var(--teal); display:none; }
  .jog .fill { position:absolute; left:0; top:0; bottom:0; background:rgba(63,210,199,.12); }
  .jog .head { position:absolute; top:4px; bottom:4px; width:3px; margin-left:-1.5px; border-radius:2px; background:var(--teal); box-shadow:0 0 10px rgba(63,210,199,.7); }
  .jog .tl { position:absolute; right:10px; top:50%; transform:translateY(-50%); font-family:var(--mono); font-size:12px; color:var(--mute); pointer-events:none; }
  .jog .tl b { color:var(--ink); font-weight:500; }
  .rv-row { display:flex; align-items:center; justify-content:space-between; gap:6px; }
  .rb { height:48px; min-width:48px; border-radius:14px; background:var(--card); border:1px solid var(--edge); display:grid; place-items:center; font-weight:700; font-size:14px; padding:0 10px; }
  .rb svg { width:22px; height:22px; }
  .rb.play { width:64px; height:56px; border-radius:18px; background:var(--teal); color:#062825; border-color:var(--teal); }
  .rb.on { background:var(--teal); color:#062825; border-color:var(--teal); }
  .rb.mono { font-family:var(--mono); font-size:13px; }
  .rb.ab.half { border-color:var(--teal); color:var(--teal); }
  /* compare */
  .cp-panes { position:relative; flex:1; min-height:0; display:flex; flex-direction:column; gap:3px; padding-top:calc(var(--st) + 58px); }
  .cp-pane { position:relative; flex:1; min-height:0; overflow:hidden; background:#000; outline:2px solid transparent; outline-offset:-2px; }
  .cp-pane.act { outline-color:var(--teal); }
  .cp-pane video { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
  .cp-pane .tag { position:absolute; left:10px; top:10px; z-index:2; max-width:70%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cp-pane .off { position:absolute; right:10px; top:10px; z-index:2; font-family:var(--mono); font-size:12px; }
  .cp-panes.ghost .cp-pane.b { position:absolute; inset:calc(var(--st) + 58px) 0 0 0; background:transparent; }
  .cp-panes.ghost .cp-pane.b video { opacity:var(--ghost, .5); }
  .cp-panes.ghost .cp-pane.a { flex:1; }
  .slider { display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--mute); }
  .slider input { flex:1; accent-color:var(--teal); }
  .pick { position:fixed; inset:0; z-index:45; background:rgba(5,8,10,.6); display:flex; flex-direction:column; justify-content:flex-end; }
  .pick .sheet { max-height:78vh; }
  .pick .grid { overflow-y:auto; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; }

  .toast { position:fixed; left:50%; top:calc(var(--st) + 70px); transform:translateX(-50%); z-index:60; background:var(--ink); color:#0d1116; font-weight:600;
           font-size:14px; padding:10px 17px; border-radius:999px; white-space:nowrap; max-width:92vw; overflow:hidden; text-overflow:ellipsis; pointer-events:none; }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="layer"></div>
<div id="review"></div>
<input type="file" id="importPick" accept="video/*" hidden />

<script>
'use strict';
/* ═════════ taxonomy ═════════
   ids must match desktop Smæsh so takes file themselves there:
   fh_ / bh_ / sv_ / rc_ strokes, dr_ drills, "match", "quick"            */
const CAT_DEF = [
  ['fh','Forehand',[['fh_loop','Loop'],['fh_flick','Flick'],['fh_push','Push'],['fh_drive','Drive'],['fh_block','Block'],['fh_smash','Smash']]],
  ['bh','Backhand',[['bh_loop','Loop'],['bh_flick','Flick'],['bh_push','Push'],['bh_block','Block'],['bh_drive','Drive']]],
  ['sv','Serve',[['sv_pendulum','Pendulum'],['sv_reverse_pendulum','Reverse pendulum'],['sv_tomahawk','Tomahawk'],['sv_backspin','Backspin'],['sv_backhand','Backhand serve']]],
  ['rc','Receive',[['rc_flick','Flick'],['rc_push','Push'],['rc_banana','Banana'],['rc_short_touch','Short touch']]],
  ['match','Match',[['match','Tournament'],['match','League'],['match','Practice match']]],
  ['dr','Drills',[['dr_footwork','Footwork'],['dr_multiball','Multiball'],['dr_falkenberg','Falkenberg'],['dr_random','Random']]],
];
let CATS;
try { CATS = JSON.parse(localStorage.getItem('smaesh_cats') || 'null'); } catch (e) {}
if (!Array.isArray(CATS)) CATS = JSON.parse(JSON.stringify(CAT_DEF));
const saveCats = () => { try { localStorage.setItem('smaesh_cats', JSON.stringify(CATS)); } catch (e) {} };
const SHORT = { fh:'FH', bh:'BH', sv:'SV', rc:'RC', match:'MATCH', dr:'DRILL', quick:'QUICK' };
const STROKE = ['fh','bh','sv','rc'];
const cat = k => CATS.find(c => c[0] === k);
const slug = s => s.toLowerCase().replace(/æ/g,'ae').replace(/ø/g,'o').replace(/å/g,'a').normalize('NFD').replace(/[̀-ͯ]/g,'')
                   .replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0, 30) || 'stroke';
const idFor = (c, name) => c === 'match' ? 'match' : c + '_' + slug(name);
function catOfId(id) {
  if (!id) return 'fh';
  if (id === 'match') return 'match';
  if (id === 'quick') return 'quick';
  const p = id.slice(0, 2);
  return p === 'dr' ? 'dr' : STROKE.includes(p) ? p : 'fh';
}
function labelOf(t) {
  if (t.label) return t.label;
  const c = cat(t.cat); const hit = c && c[2].find(x => x[0] === t.strokeId);
  return hit ? hit[1] : (t.strokeId || '').replace(/^[a-z]{2}_/, '').replace(/_/g, ' ').replace(/^./, m => m.toUpperCase());
}

/* ═════════ storage: IndexedDB takes (same store the old capture app used) ═════════ */
let _db = null;
function db() {
  if (_db) return Promise.resolve(_db);
  return new Promise((res, rej) => {
    const rq = indexedDB.open('replay_capture', 1);
    rq.onupgradeneeded = e => e.target.result.createObjectStore('takes', { keyPath:'id' });
    rq.onsuccess = e => { _db = e.target.result; res(_db); };
    rq.onerror = e => rej(e.target.error);
  });
}
async function dbAll() { const d = await db(); return new Promise(res => { const rq = d.transaction('takes').objectStore('takes').getAll(); rq.onsuccess = () => res(rq.result || []); }); }
async function dbPut(t) { const d = await db(); return new Promise(res => { const tx = d.transaction('takes','readwrite'); tx.objectStore('takes').put(t); tx.oncomplete = res; }); }
async function dbDel(id) { const d = await db(); return new Promise(res => { const tx = d.transaction('takes','readwrite'); tx.objectStore('takes').delete(id); tx.oncomplete = res; }); }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2);
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

/* ═════════ state ═════════ */
const S = {
  tab:'record', takes:[], open:null, adding:null, menu:null, importFile:null,
  sec:'strokes', filter:'all', sel:null, delSure:false,
  recent: (() => { try { return JSON.parse(localStorage.getItem('smaesh_recent') || '[]'); } catch (e) { return []; } })(),
  cam:null, quick:null, player:null, clearSure:false,
};
const saveRecent = () => { try { localStorage.setItem('smaesh_recent', JSON.stringify(S.recent.slice(0, 4))); } catch (e) {} };
const unsent = () => S.takes.filter(t => t.sync !== 'sent');

/* ═════════ helpers ═════════ */
const I = {
  fh:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="9.5" cy="9.5" rx="6.5" ry="7" fill="currentColor" fill-opacity=".22"/><path d="M14 15l5.5 5.5" stroke-width="3.4"/></svg>',
  bh:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="14.5" cy="9.5" rx="6.5" ry="7" fill="currentColor" fill-opacity=".22"/><path d="M10 15l-5.5 5.5" stroke-width="3.4"/></svg>',
  sv:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.5"/><path d="M12 9v4M8 21l4-8 4 8"/></svg>',
  rc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17c4-8 14-8 18 0"/><circle cx="12" cy="9" r="2"/></svg>',
  match:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="10" rx="1.5"/><path d="M12 7v10M3 12h18"/></svg>',
  dr:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v4h4"/></svg>',
  cloud:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a5 5 0 1 1 1-9.9A6 6 0 0 1 19 10a4 4 0 0 1-1 8z"/><path d="M12 16v-5M9.5 13.5 12 11l2.5 2.5"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>',
  flip:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 19H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"/><path d="M13 5h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-5"/><circle cx="12" cy="12" r="3"/></svg>',
  photo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>',
  save:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>',
  send:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>',
  lib:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="9" rx="1.5"/><rect x="3" y="15" width="7" height="6" rx="1.5"/><rect x="14" y="15" width="7" height="6" rx="1.5"/></svg>',
  cmp:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="8" rx="1.5"/><rect x="3" y="13" width="18" height="8" rx="1.5"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>',
  pause:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4" height="15" rx="1"/><rect x="14" y="4.5" width="4" height="15" rx="1"/></svg>',
  fb:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="11 17 6 12 11 7"/><line x1="18" y1="17" x2="18" y2="7"/></svg>',
  ff:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="13 17 18 12 13 7"/><line x1="6" y1="17" x2="6" y2="7"/></svg>',
  chevL:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>',
  chevR:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>',
  linkOn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>',
  ghost:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="13" height="13" rx="2"/><rect x="8" y="3" width="13" height="13" rx="2" stroke-dasharray="3 3"/></svg>',
  swap:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M7 4 3 8M7 4l4 4M17 20V4M17 20l-4-4M17 20l4-4"/></svg>',
  link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="12" height="9" rx="1.5"/><path d="M6 17h4M8 13v4"/><rect x="16" y="8" width="6" height="12" rx="1.5"/></svg>',
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const pad = n => String(n).padStart(2, '0');
const stamp = d => d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + '-' + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds());
const fmtDur = s => !s ? '' : s >= 60 ? `${Math.floor(s / 60)}:${pad(Math.round(s % 60))}` : s.toFixed(1) + 's';
const fmtClock = s => Math.floor(s / 60) + ':' + pad(Math.floor(s % 60));
function dayLabel(ts) {
  const d0 = new Date(); d0.setHours(0,0,0,0);
  const d = Math.floor((d0.getTime() + 864e5 - ts) / 864e5);
  return d <= 0 ? 'Today' : d === 1 ? 'Yesterday' : new Date(ts).toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
}
let toastT = null;
function toast(m) {
  setTimeout(() => {
    document.querySelectorAll('.toast').forEach(t => t.remove());
    const d = document.createElement('div'); d.className = 'toast'; d.textContent = m; document.body.appendChild(d);
    clearTimeout(toastT); toastT = setTimeout(() => d.remove(), 2200);
  }, 0);
}
const urlCache = new Map();
const blobURL = t => { if (!urlCache.has(t.id)) urlCache.set(t.id, URL.createObjectURL(t.blob)); return urlCache.get(t.id); };

// a still from the take, for the library grid
function makeThumb(blob) {
  return new Promise(res => {
    const v = document.createElement('video'), u = URL.createObjectURL(blob);
    let done = false;
    const fin = x => { if (done) return; done = true; URL.revokeObjectURL(u); res(x); };
    v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = u;
    v.onloadeddata = () => { try { v.currentTime = Math.min(0.4, (v.duration || 1) / 2); } catch (e) { fin(null); } };
    v.onseeked = () => {
      try {
        const cv = document.createElement('canvas'); const w = 240;
        cv.width = w; cv.height = Math.round(w * (v.videoHeight || 16) / (v.videoWidth || 9));
        cv.getContext('2d').drawImage(v, 0, 0, cv.width, cv.height);
        fin(cv.toDataURL('image/jpeg', .7));
      } catch (e) { fin(null); }
    };
    v.onerror = () => fin(null);
    setTimeout(() => fin(null), 6000);
  });
}

async function loadTakes() {
  const all = await dbAll();
  // takes from the old capture app carry only strokeId; fill in the rest
  all.forEach(t => { if (!t.cat) t.cat = catOfId(t.strokeId); if (!t.sync) t.sync = 'local'; });
  S.takes = all.sort((a, b) => b.createdAt - a.createdAt);
  render();
  for (const t of S.takes.filter(x => !x.thumb && x.blob).slice(0, 40)) {
    t.thumb = await makeThumb(t.blob) || 'none';
    await dbPut(t); render();
  }
}
async function addTake({ strokeId, label, blob, dur, createdAt, quick, fps }) {
  const type = blob.type || 'video/mp4';
  const ext = /quicktime/.test(type) ? 'mov' : type.includes('mp4') ? 'mp4' : 'webm';
  const d = new Date(createdAt || Date.now());
  const sameDay = S.takes.filter(t => t.strokeId === strokeId && dayLabel(t.createdAt) === dayLabel(d.getTime())).length;
  const name = `replay~${strokeId}~${stamp(d)}~${sameDay + 1}.${ext}`;
  const t = { id:uid(), strokeId, cat:catOfId(strokeId), label, name, blob, size:blob.size, dur:dur || 0, createdAt:d.getTime(), sync:'local', quick:!!quick, fps: fps || 0 };
  S.takes.unshift(t);
  await dbPut(t);
  makeThumb(blob).then(async th => { t.thumb = th || 'none'; await dbPut(t); if (S.tab === 'library' && !S.cam && !S.quick) render(); });
  return t;
}

/* ═════════ upload: the phone's share sheet → Save to Files (Drive / iCloud folder) ═════════ */
async function shareTakes(list, markSent = true) {
  const files = list.map(t => new File([t.blob], t.name, { type: t.blob.type || 'video/mp4' }));
  if (navigator.canShare && navigator.canShare({ files })) {
    try {
      await navigator.share({ files });
      if (markSent) { for (const t of list) { t.sync = 'sent'; await dbPut(t); } }
      return true;
    } catch (e) { if (e.name !== 'AbortError') toast('Sharing failed: ' + e.message); return false; }
  }
  // desktop browsers: download instead
  for (const t of list) {
    const a = document.createElement('a'); a.href = blobURL(t); a.download = t.name;
    document.body.appendChild(a); a.click(); a.remove();
  }
  if (markSent) { for (const t of list) { t.sync = 'sent'; await dbPut(t); } }
  return true;
}

/* ═════════ tabs ═════════ */
function tabs() {
  const n = unsent().length;
  return `<div class="tabs">
    <button class="tab${S.tab === 'library' ? ' on' : ''}" data-tab="library">${I.lib}Library${n ? `<span class="dot">${n}</span>` : ''}</button>
    <button class="tab mid${S.tab === 'record' ? ' on' : ''}" id="midBtn" aria-label="Record · hold for a quick clip"><i></i></button>
    <button class="tab${S.tab === 'link' ? ' on' : ''}" data-tab="link">${I.link}PC link</button></div>`;
}

/* ═════════ record ═════════ */
function recordScreen() {
  const openIdx = CATS.findIndex(c => c[0] === S.open);
  let h = `<div class="top"><span class="word">Record</span><span class="tact">
    <label class="iconbtn" aria-label="Label a video from Photos">${I.photo}<input type="file" accept="video/*" id="photoPick"></label></span></div><div class="body">`;
  if (S.importFile) h += `<div class="banner"><b>Tap what this video shows</b><button data-cancelimport>Cancel</button></div>`;
  h += `<div class="cats">`;
  CATS.forEach((c, i) => {
    const n = S.takes.filter(t => t.cat === c[0]).length;
    h += `<button class="cat${S.open === c[0] ? ' on' : ''}" data-open="${c[0]}">${I[c[0]]}${c[1]}<span class="n">${n || ''}</span></button>`;
    if (i % 2 === 1 && S.open && Math.floor(openIdx / 2) === Math.floor(i / 2)) {
      const tail = S.adding === S.open ? `<input class="new" id="newStroke" placeholder="Name" maxlength="24" autocomplete="off" enterkeyhint="done">`
                                        : `<button class="opt add" data-add="${S.open}" aria-label="Add">+</button>`;
      h += `<div class="drawer">${cat(S.open)[2].map(([id, n]) => `<button class="opt" data-pick="${S.open}|${esc(n)}">${esc(n)}</button>`).join('')}${tail}</div>`;
    }
  });
  h += `</div>`;
  const rec = S.recent.filter(([c, n]) => cat(c) && cat(c)[2].some(x => x[1] === n));
  if (rec.length) h += `<div class="lab">RECENT</div><div class="quick">${rec.map(([c, n]) => `<button class="opt" data-pick="${c}|${esc(n)}">${SHORT[c]} ${esc(n)}</button>`).join('')}</div>`;
  return h + `</div>` + tabs();
}

/* ═════════ library ═════════ */
const secOf = t => STROKE.includes(t.cat) || t.cat === 'quick' ? 'strokes' : t.cat === 'match' ? 'matches' : 'drills';
const libList = () => S.takes.filter(t => secOf(t) === S.sec && (S.sec !== 'strokes' || S.filter === 'all' || t.cat === S.filter));
function libraryScreen() {
  const list = libList();
  const count = k => S.takes.filter(t => secOf(t) === k).length;
  const n = unsent().length;
  let h = `<div class="top"><span class="word">Library</span></div><div class="body">`;
  h += `<div class="seg">${[['strokes','STROKES'],['matches','MATCHES'],['drills','DRILLS']].map(([k, l]) => `<button data-sec="${k}" class="${S.sec === k ? 'on' : ''}">${l} · ${count(k)}</button>`).join('')}</div>`;
  if (S.sec === 'strokes') h += `<div class="chips">${[['all','All'],['fh','FH'],['bh','BH'],['sv','Serve'],['rc','Receive']].map(([k, l]) => `<button class="chip${S.filter === k ? ' on' : ''}" data-f="${k}">${l}</button>`).join('')}</div>`;
  if (n && !S.sel) h += `<div class="up"><span class="bi">${I.cloud}</span><b>${n} not on PC yet</b><button class="go" data-upall>Upload</button></div>`;
  const th = (t, wide) => {
    const on = S.sel && S.sel.has(t.id);
    const mark = S.sel ? `<span class="tick${on ? '' : ' off'}">${on ? '✓' : ''}</span>` : `<span class="sync ${t.sync === 'sent' ? 'sent' : 'local'}">${t.sync === 'sent' ? I.check : I.cloud}</span>`;
    const bg = t.thumb && t.thumb !== 'none' ? ` style="background-image:url(${t.thumb})"` : '';
    return `<button class="thumb${wide ? ' wide' : ''}${on ? ' sel' : ''}" data-t="${t.id}"${bg}>${wide ? '' : `<span class="k">${SHORT[t.cat] || ''} · ${esc(labelOf(t))}</span>`}${mark}<span class="d">${fmtDur(t.dur)}</span></button>`;
  };
  if (!list.length) h += `<div class="empty">${I[S.sec === 'matches' ? 'match' : S.sec === 'drills' ? 'dr' : 'fh']}<span>Nothing here yet</span><button data-tab="record">Record</button></div>`;
  else if (S.sec === 'matches') h += list.map(t => `<div class="mcard">${th(t, true)}<span class="mt"><b>${esc(labelOf(t))}</b><span>${dayLabel(t.createdAt)} · ${fmtDur(t.dur)}</span></span></div>`).join('');
  else {
    const groups = [];
    list.forEach(t => { const l = dayLabel(t.createdAt); if (!groups.length || groups[groups.length - 1][0] !== l) groups.push([l, []]); groups[groups.length - 1][1].push(t); });
    groups.forEach(([l, ts]) => { h += `<div class="ghead"><b>${l}</b><span>${ts.length}</span></div><div class="g3">${ts.map(t => th(t)).join('')}</div>`; });
  }
  h += `</div>`;
  if (S.sel) return h + `<div class="actionbar"><button data-cancel>Cancel</button>
    <button class="danger${S.delSure ? ' sure' : ''}" data-del>${S.delSure ? `Delete ${S.sel.size}?` : I.trash + S.sel.size}</button>
    ${S.sel.size === 2 ? `<button data-cmp>${I.cmp}Compare</button>` : ''}
    <button class="primary" data-up>${I.cloud}${S.sel.size === 2 ? '' : 'Upload '}${S.sel.size}</button></div>`;
  return h + tabs();
}

/* ═════════ PC link ═════════ */
function linkScreen() {
  const bytes = S.takes.reduce((a, t) => a + (t.size || 0), 0);
  const sent = S.takes.filter(t => t.sync === 'sent');
  return `<div class="top"><span class="word">PC link</span></div><div class="body">
    <div class="card"><h3>Send clips to Smæsh on your PC</h3>
      <ol><li>In <b>Library</b>, tap <b>Upload</b> (or hold clips to pick some).</li>
      <li>Choose <b>Save to Files</b> and save into one folder, for example <b>Google Drive › Smæsh</b>.</li>
      <li>On the PC, open Smæsh and press <b>Phone clips</b>. Pick that same folder the first time.</li></ol>
      <p>Every clip is filed under its stroke with the date it was filmed.</p></div>
    <div class="card"><h3>On this phone</h3>
      <div class="stat"><span>Clips</span><b>${S.takes.length}</b></div>
      <div class="stat"><span>Not on PC yet</span><b>${unsent().length}</b></div>

const RES = [[1280,720,'720p'],[1920,1080,'1080p'],[3840,2160,'4K']];
const FPS = [30, 60];
const LIMITS = [[0,'off'],[30,'30s'],[60,'1m'],[300,'5m'],[600,'10m']];
let cfg = { res:1, fps:1, limit:0, lens:'' };
try { Object.assign(cfg, JSON.parse(localStorage.getItem('cap_cfg') || '{}')); } catch (e) {}

}
const lensLabel = d => { const l = (d.label || '').toLowerCase(); return l.includes('ultra') ? '0.5x' : l.includes('tele') ? '3x' : '1x'; };
async function startStream() {
  stopStream();
  try {
    const [w, h] = RES[cfg.res];
    const video = { width:{ ideal:w }, height:{ ideal:h }, frameRate:{ ideal:FPS[cfg.fps] } };
    if (cfg.lens && facing === 'environment') video.deviceId = { exact:cfg.lens }; else video.facingMode = { ideal:facing };
    stream = await navigator.mediaDevices.getUserMedia({ video, audio:true });
    document.querySelectorAll('video.live').forEach(v => { v.srcObject = stream; });

}

}

let recTimer = null, recLimit = null;
async function openCam(catK, label) {

      if (!blob) return;
      const t = await addTake({ strokeId:c.strokeId, label:c.label, blob, dur:(Date.now() - c.rec0) / 1000, fps:streamFps() });
      c.takes++; toast(`Saved · ${SHORT[c.cat]} ${c.label} · take ${c.takes}`);

const RATES = [1, 0.5, 0.25];

// hold-to-repeat for the frame buttons

      else if (z > 1) { x += e.movementX || 0; y += e.movementY || 0; apply(); }
    } else if (g.mode === 'two' && pts.size === 2) {

  const d = document.createElement('div'); d.className = 'pick';
  d.innerHTML = `<div class="sheet"><span class="grab"></span><div class="mh">Compare with</div>
    ${same.length ? `<div class="lab">${esc(labelOf(first))}</div><div class="grid">${same.map(tile).join('')}</div>` : ''}
    ${rest.length ? `<div class="lab">Other clips</div><div class="grid">${rest.map(tile).join('')}</div>` : ''}
    ${!same.length && !rest.length ? '<p style="color:var(--mute);text-align:center">Record another clip to compare against.</p>' : ''}</div>`;
  d.onclick = e => { if (e.target === d) d.remove(); };
  d.querySelectorAll('[data-pk]').forEach(b => b.onclick = () => { d.remove(); openCompare(first, S.takes.find(t => t.id === b.dataset.pk)); });
  rvEl().appendChild(d);
}

/* ═════════ compare ═════════ */
const CP = { a:null, b:null, act:'a', link:true, off:0, ghost:false, rate:0, raf:0 };
function openCompare(a, b) {
  if (!a || !b) return;
  cancelAnimationFrame(RV.raf);
  Object.assign(CP, { a, b, act:'a', link:true, off:0, ghost:false });
  const root = rvEl();
  root.innerHTML = `<div class="rv" id="cp">
    <div class="rv-top"><button class="cbtn" data-cp="close" aria-label="Back">${I.back}</button><span class="sp"></span>
      <button class="rb" data-cp="swap" style="height:42px" aria-label="Swap">${I.swap}</button>
      <button class="rb" data-cp="ghost" id="cpGhost" style="height:42px" aria-label="Overlay">${I.ghost}</button></div>
    <div class="cp-panes" id="cpPanes">
      <div class="cp-pane a act" data-pane="a"><video playsinline muted loop></video><span class="pill label tag"></span></div>
      <div class="cp-pane b" data-pane="b"><video playsinline muted loop></video><span class="pill tag"></span><span class="pill off" id="cpOff"></span></div>
      <div class="rv-hud"></div></div>
    <div class="rv-dock">
      <div class="slider" id="cpSlide" hidden>A<input type="range" min="10" max="90" value="50" id="cpOpacity" aria-label="Overlay opacity">B</div>
      <div class="jog" id="cpJog"><div class="ticks"></div><div class="fill" id="cpFill"></div><div class="head" id="cpHead"></div>
        <div class="tl"><b id="cpCur">0:00.00</b> <span id="cpWho"></span></div></div>
      <div class="rv-row">
        <button class="rb mono" data-cp="rate" id="cpRate">1×</button>
        <button class="rb" id="cpFb" aria-label="Back one frame">${I.fb}</button>
        <button class="rb play" data-cp="play" id="cpPlay" aria-label="Play or pause">${I.play}</button>
        <button class="rb" id="cpFf" aria-label="Forward one frame">${I.ff}</button>
        <button class="rb on" data-cp="link" id="cpLink" aria-label="Link both clips">${I.linkOn}</button>
      </div></div></div>`;
  const va = root.querySelector('[data-pane=a] video'), vb = root.querySelector('[data-pane=b] video');
  const vids = { a:va, b:vb };
  const load = () => {
    va.src = blobURL(CP.a); vb.src = blobURL(CP.b);
    root.querySelector('[data-pane=a] .tag').textContent = `${SHORT[CP.a.cat] || ''} · ${labelOf(CP.a)} · ${dayLabel(CP.a.createdAt)}`;
    root.querySelector('[data-pane=b] .tag').textContent = `${SHORT[CP.b.cat] || ''} · ${labelOf(CP.b)} · ${dayLabel(CP.b.createdAt)}`;
    [va, vb].forEach(v => { v.playbackRate = RATES[CP.rate]; v.onloadedmetadata = () => { v.playbackRate = RATES[CP.rate]; }; });
    va.currentTime = 0; vb.currentTime = CP.off;
  };
  const cur = () => vids[CP.link ? 'a' : CP.act];
  const both = () => CP.link ? [va, vb] : [vids[CP.act]];
  const setT = t => {
    if (CP.link) { va.currentTime = Math.max(0, t); vb.currentTime = Math.max(0, t + CP.off); }
    else vids[CP.act].currentTime = Math.max(0, t);
  };
  const paused = () => va.paused && vb.paused;
  const syncBtn = () => { root.querySelector('#cpPlay').innerHTML = paused() ? I.play : I.pause; };
  const pauseAll = () => { va.pause(); vb.pause(); syncBtn(); };
  const playAll = () => { both().forEach(v => v.play().catch(() => {})); syncBtn(); };
  load();
  // tap a pane to make it the one the controls move (when unlinked)
  root.querySelectorAll('.cp-pane').forEach(p => {
    const ctl = { time: () => vids[p.dataset.pane].currentTime - (CP.link && p.dataset.pane === 'b' ? CP.off : 0),
      pause: pauseAll, seek: t => { if (!CP.link) CP.act = p.dataset.pane; setT(t); markAct(); },
      tap: () => { CP.act = p.dataset.pane; markAct(); } };
    stageGestures(p, [p.querySelector('video')], ctl);
  });
  const markAct = () => {
    root.querySelectorAll('.cp-pane').forEach(p => p.classList.toggle('act', !CP.link && p.dataset.pane === CP.act));
    root.querySelector('#cpWho').textContent = CP.link ? '· both' : `· ${CP.act === 'a' ? 'top' : 'bottom'} only`;
    const o = root.querySelector('#cpOff'); o.textContent = `${CP.off >= 0 ? '+' : ''}${CP.off.toFixed(2)}s`; o.hidden = Math.abs(CP.off) < 0.005;
  };
  markAct();
  jogBar(root.querySelector('#cpJog'), () => cur().duration || 0, t => { pauseAll(); setT(t); });
  const step = dir => { pauseAll(); const v = cur(), s = stepOf(v === va ? CP.a : CP.b);
    setT((CP.link ? va.currentTime : v.currentTime) + dir * s); hud(root, (dir > 0 ? '+' : '−') + '1 frame'); };
  repeatBtn(root.querySelector('#cpFb'), () => step(-1));
  repeatBtn(root.querySelector('#cpFf'), () => step(1));
  root.querySelector('#cpOpacity').oninput = e => root.querySelector('#cpPanes').style.setProperty('--ghost', e.target.value / 100);
  root.querySelectorAll('[data-cp]').forEach(b => b.onclick = () => {
    const a = b.dataset.cp;
    if (a === 'close') { closeReview(); }
    else if (a === 'play') { paused() ? playAll() : pauseAll(); }
    else if (a === 'rate') { CP.rate = (CP.rate + 1) % RATES.length; [va, vb].forEach(v => v.playbackRate = RATES[CP.rate]);
      b.textContent = ['1×','½×','¼×'][CP.rate]; b.classList.toggle('on', CP.rate > 0); }
    else if (a === 'link') {
      // relinking keeps whatever alignment was set while unlinked
      if (!CP.link) CP.off = vb.currentTime - va.currentTime;
      CP.link = !CP.link; b.classList.toggle('on', CP.link); pauseAll(); markAct();
      hud(root, CP.link ? 'Linked' : 'Unlinked · tap a clip to move it');
    }
    else if (a === 'ghost') { CP.ghost = !CP.ghost; root.querySelector('#cpPanes').classList.toggle('ghost', CP.ghost);
      b.classList.toggle('on', CP.ghost); root.querySelector('#cpSlide').hidden = !CP.ghost; }
    else if (a === 'swap') { [CP.a, CP.b] = [CP.b, CP.a]; CP.off = -CP.off; pauseAll(); load(); markAct(); }
  });
  cancelAnimationFrame(CP.raf);
  const tick = () => {
    if (!document.getElementById('cp')) return;
    // keep the pair in step while playing linked
    if (CP.link && !va.paused && !vb.paused && Math.abs(vb.currentTime - (va.currentTime + CP.off)) > 0.08) vb.currentTime = va.currentTime + CP.off;
    const v = cur(), d = v.duration || 0, t = v.currentTime, f = d ? t / d * 100 : 0;
    root.querySelector('#cpHead').style.left = f + '%'; root.querySelector('#cpFill').style.width = f + '%';
    root.querySelector('#cpCur').textContent = fmtT(t);
    CP.raf = requestAnimationFrame(tick);
  };
  CP.raf = requestAnimationFrame(tick);
}

/* ═════════ menus ═════════ */
function menuHtml() {
  const m = S.menu, name = esc(m.name);
  return `<div class="menu" data-mclose><div class="sheet"><span class="grab"></span>` + (
    m.mode === 'rename' ? `<div class="mh">Rename</div><input id="renameIn" value="${name}" maxlength="24" autocomplete="off" enterkeyhint="done">
        <button class="act primary" data-m="saveName">Save</button><button class="act plain" data-m="cancel">Cancel</button>`
    : m.mode === 'delete' ? `<div class="mh">Delete ${name}?</div><button class="act danger" data-m="doDelete">Delete</button><button class="act plain" data-m="cancel">Cancel</button>`
    : `<div class="mh">${SHORT[m.cat]} · ${name}</div><button class="act" data-m="rename">Rename</button>
        <button class="act danger" data-m="delete">Delete</button><button class="act plain" data-m="cancel">Cancel</button>`) + `</div></div>`;
}

/* ═════════ render + wiring ═════════ */
function render() {
  const app = document.getElementById('app'), layer = document.getElementById('layer');
  const scroll = app.querySelector('.body') ? app.querySelector('.body').scrollTop : 0;
  app.innerHTML = S.tab === 'record' ? recordScreen() : S.tab === 'library' ? libraryScreen() : linkScreen();
  const b = app.querySelector('.body'); if (b) b.scrollTop = scroll;
  const liveBefore = !!layer.querySelector('video.live');
  layer.innerHTML = (S.cam ? camHtml() : '') + (S.quick ? quickHtml() : '') + (S.player ? playerHtml() : '') + (S.menu ? menuHtml() : '');
  if (stream) layer.querySelectorAll('video.live').forEach(v => { v.srcObject = stream; });
  wire();
}
function wire() {
  const $$ = s => document.querySelectorAll(s);
  $$('[data-tab]').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; S.sel = null; S.delSure = false; S.clearSure = false; render(); });
  // record tab button: tap = picker, hold = quick camera
  const mid = document.getElementById('midBtn');
  if (mid) {
    let tm = null, held = false;
    mid.onpointerdown = e => { e.preventDefault(); held = false; tm = setTimeout(() => { tm = null; held = true; openQuick(); }, 350); };
    mid.onpointerup = () => { if (tm) { clearTimeout(tm); tm = null; S.tab = 'record'; S.sel = null; render(); } };
    mid.onpointerleave = mid.onpointercancel = () => { if (tm) { clearTimeout(tm); tm = null; } };
    mid.oncontextmenu = e => e.preventDefault();
  }
  // record: categories, add, hold to rename/delete
  $$('[data-open]').forEach(b => b.onclick = () => { S.open = S.open === b.dataset.open ? null : b.dataset.open; S.adding = null; render(); });
  $$('[data-add]').forEach(b => b.onclick = () => { S.adding = b.dataset.add; render(); });
  const nw = document.getElementById('newStroke');
  if (nw) {
    nw.focus();
    const done = keep => {
      nw.onblur = null;
      const v = nw.value.trim(), list = cat(S.adding)[2];
      if (keep && v && !list.some(x => x[1].toLowerCase() === v.toLowerCase())) { list.push([idFor(S.adding, v), v]); saveCats(); toast('Added ' + v); }
      S.adding = null; render();
    };
    nw.onkeydown = e => { if (e.key === 'Enter') done(true); if (e.key === 'Escape') done(false); };
    nw.onblur = () => done(true);
  }
  $$('[data-pick]').forEach(b => {
    let tm = null;
    if (b.closest('.drawer')) {
      b.onpointerdown = () => { b.classList.add('hold'); tm = setTimeout(() => { tm = null; b._held = true; const [c, n] = b.dataset.pick.split('|'); S.menu = { cat:c, name:n }; render(); }, 480); };
      b.onpointerup = b.onpointerleave = b.onpointercancel = () => { if (tm) clearTimeout(tm); tm = null; b.classList.remove('hold'); };
      b.oncontextmenu = e => e.preventDefault();
    }
    b.onclick = async () => {
      if (b._held) { b._held = false; return; }
      const [c, n] = b.dataset.pick.split('|');
      if (S.importFile) {                                    // labelling a video from Photos
        const f = S.importFile; S.importFile = null;
        const hit = cat(c)[2].find(x => x[1] === n);
        const ts = f.lastModified && f.lastModified > 631152000000 ? f.lastModified : Date.now();
        await addTake({ strokeId: hit ? hit[0] : idFor(c, n), label:n, blob:f, dur:0, createdAt:ts });
        toast(`Added to Library · ${SHORT[c]} ${n}`); render(); return;
      }
      openCam(c, n);
    };
  });
  const pp = document.getElementById('photoPick');
  if (pp) pp.onchange = () => { const f = pp.files[0]; pp.value = ''; if (f) { S.importFile = f; S.tab = 'record'; render(); } };
  $$('[data-cancelimport]').forEach(b => b.onclick = () => { S.importFile = null; render(); });
  $$('[data-m]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const m = S.menu, list = cat(m.cat)[2], a = b.dataset.m, i = list.findIndex(x => x[1] === m.name);
    if (a === 'cancel') S.menu = null;
    else if (a === 'rename' || a === 'delete') m.mode = a;
    else if (a === 'doDelete') { if (i >= 0) list.splice(i, 1); saveCats(); S.menu = null; toast('Deleted ' + m.name); }
    else if (a === 'saveName') {
      const v = document.getElementById('renameIn').value.trim();
      if (v && v !== m.name && i >= 0) {
        list[i] = [idFor(m.cat, v), v];
        S.recent = S.recent.map(r => (r[0] === m.cat && r[1] === m.name) ? [m.cat, v] : r); saveRecent(); saveCats(); toast('Renamed to ' + v);
      }
      S.menu = null;
    }
    render();
  });
  const menuEl = document.querySelector('[data-mclose]');
  if (menuEl) menuEl.onclick = e => { if (e.target === menuEl) { S.menu = null; render(); } };
  const ri = document.getElementById('renameIn');
  if (ri) { ri.focus(); ri.select(); ri.onkeydown = e => { if (e.key === 'Enter') document.querySelector('[data-m=saveName]').click(); }; }

  // library
  $$('[data-sec]').forEach(b => b.onclick = () => { S.sec = b.dataset.sec; S.filter = 'all'; S.sel = null; render(); });
  $$('[data-f]').forEach(b => b.onclick = () => { S.filter = b.dataset.f; render(); });
  $$('[data-upall]').forEach(b => b.onclick = async () => { if (await shareTakes(unsent())) { toast('Uploaded · import them on the PC'); render(); } });
  $$('.thumb[data-t]').forEach(b => {
    let tm = null;
    b.onpointerdown = () => { if (S.sel) return; tm = setTimeout(() => { tm = null; S.sel = new Set([b.dataset.t]); S.delSure = false; b._held = true; render(); }, 450); };
    b.onpointerup = b.onpointerleave = b.onpointercancel = () => { if (tm) clearTimeout(tm); tm = null; };
    b.oncontextmenu = e => e.preventDefault();
    b.onclick = () => {
      if (b._held) { b._held = false; return; }
      if (!S.sel) { const list = libList(); openReview(list, list.findIndex(t => t.id === b.dataset.t)); return; }
      S.sel.has(b.dataset.t) ? S.sel.delete(b.dataset.t) : S.sel.add(b.dataset.t);
      S.delSure = false; if (!S.sel.size) S.sel = null; render();
    };
  });
  $$('[data-cmp]').forEach(b => b.onclick = () => {
    const [x, y] = S.takes.filter(t => S.sel.has(t.id)); S.sel = null; S.delSure = false; render(); openCompare(x, y);
  });
  $$('[data-cancel]').forEach(b => b.onclick = () => { S.sel = null; S.delSure = false; render(); });
  $$('[data-up]').forEach(b => b.onclick = async () => {
    const list = S.takes.filter(t => S.sel.has(t.id));
    if (await shareTakes(list)) { S.sel = null; toast(`Uploaded ${list.length}`); render(); }
  });
  $$('[data-del]').forEach(b => b.onclick = async () => {
    if (!S.delSure) { S.delSure = true; render(); return; }
    const ids = [...S.sel]; for (const id of ids) await dbDel(id);
    S.takes = S.takes.filter(t => !S.sel.has(t.id)); S.sel = null; S.delSure = false; render(); toast(`Deleted ${ids.length}`);
  });
  $$('[data-clearsent]').forEach(b => b.onclick = async () => {
    if (!S.clearSure) { S.clearSure = true; render(); return; }
    const gone = S.takes.filter(t => t.sync === 'sent'); for (const t of gone) await dbDel(t.id);
    S.takes = S.takes.filter(t => t.sync !== 'sent'); S.clearSure = false; render(); toast(`Freed ${gone.length} clips`);
  });
  $$('[data-pl]').forEach(b => b.onclick = async () => {
    const t = S.takes.find(x => x.id === S.player.id), a = b.dataset.pl;
    if (a === 'close') { S.player = null; render(); }
    else if (a === 'share') { if (await shareTakes([t])) { toast('Uploaded'); render(); } }
    else if (a === 'del') {
      if (!S.player.sure) { S.player.sure = true; render(); return; }
      await dbDel(t.id); S.takes = S.takes.filter(x => x.id !== t.id); S.player = null; render(); toast('Deleted');
    }
  });

  // camera
  $$('[data-shut]').forEach(b => b.onclick = camShutter);
  $$('[data-camback]').forEach(b => b.onclick = closeCam);
  $$('[data-camlib]').forEach(b => b.onclick = () => {
    const c = S.cam; if (!c || c.rec) return;
    stopStream(); S.cam = null; S.tab = 'library';
    S.sec = STROKE.includes(c.cat) ? 'strokes' : c.cat === 'match' ? 'matches' : 'drills'; S.filter = STROKE.includes(c.cat) ? c.cat : 'all';
    render();
  });
  $$('[data-flip]').forEach(b => b.onclick = () => {
    if ((S.cam && S.cam.rec) || (S.quick && S.quick.rec)) return;
    facing = facing === 'environment' ? 'user' : 'environment'; startStream();
  });
  $$('[data-o]').forEach(b => b.onclick = () => {
    const k = b.dataset.o;
    if (k === 'lens') { if (lenses.length < 2) return; const i = lenses.findIndex(d => d.deviceId === cfg.lens); cfg.lens = lenses[(i + 1) % lenses.length].deviceId; }
    else cfg[k] = (cfg[k] + 1) % (k === 'res' ? RES : k === 'fps' ? FPS : LIMITS).length;
    saveCfg(); render(); startStream();
  });
  // quick camera
  const ring = document.getElementById('ring');
  if (ring) { ring.onpointerdown = e => { e.preventDefault(); quickStart(); }; ring.oncontextmenu = e => e.preventDefault(); }
  $$('[data-q]').forEach(b => b.onclick = async () => {
    const a = b.dataset.q;
    if (a === 'back') { stopStream(); S.quick = null; render(); }
    else if (a === 'discard') { if (!S.quick.saved) toast('Discarded'); quickReset(); }
    else if (a === 'save') { await quickSave(); toast('Saved to Library'); }
    else if (a === 'send') {
      // any contact on the phone: Messages, Snapchat, WhatsApp… via the share sheet
      const q = S.quick;
      const file = new File([q.blob], `smaesh-${stamp(new Date())}.${(q.blob.type || '').includes('mp4') ? 'mp4' : 'webm'}`, { type:q.blob.type || 'video/mp4' });
      if (navigator.canShare && navigator.canShare({ files:[file] })) {
        try { await navigator.share({ files:[file] }); toast('Sent'); quickReset(); } catch (e) { if (e.name !== 'AbortError') toast('Sending failed'); }
      } else toast('Sending needs the phone app');
    }
  });
}
window.addEventListener('pointerup', () => { if (S.quick && S.quick.rec) quickStop(); });
window.addEventListener('pointercancel', () => { if (S.quick && S.quick.rec) quickStop(); });
document.addEventListener('visibilitychange', () => {
  // the camera doesn't survive the app going to the background: stop cleanly
  if (document.visibilityState === 'hidden') {
    if (S.cam && S.cam.rec) camShutter();
    if (S.quick && S.quick.rec) quickStop();
  } else if ((S.cam || (S.quick && S.quick.mode === 'live')) && !stream) startStream();
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
render();
loadTakes();
</script>
</body>
</html>
